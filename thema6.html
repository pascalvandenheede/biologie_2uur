<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voortplanting bij de mens – Thema 6 (2 lesuren)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
<style>
/* Layout: veldschrift — één hoofdstuk tegelijk, smalle leeskolom, oefeningen als losse werkbladen eronder */
:root{
  --paper:#EAF0EC; --sheet:#F8FBF9; --ink:#12302A; --ink-2:#4B6761; --line:#C6D6CE;
  --moss:#4C7D27; --moss-soft:#DAE8CC; --water:#2A6C84; --water-soft:#D3E6ED;
  --ok:#2C7A47; --ok-soft:#D5EDDC; --bad:#B0442D; --bad-soft:#F5DCD5;
  --bone:#F3F1EA; --dead:#8D8676;
  --f-display:"Young Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1A17; --sheet:#132420; --ink:#E1ECE6; --ink-2:#9BB3AB; --line:#29423B;
  --moss:#9CCB6B; --moss-soft:#22371B; --water:#74B5CA; --water-soft:#17313A;
  --ok:#7ACB91; --ok-soft:#163322; --bad:#EC8F77; --bad-soft:#3B1E17;
  --bone:#E9E6DC; --dead:#7A7466; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1A17; --sheet:#132420; --ink:#E1ECE6; --ink-2:#9BB3AB; --line:#29423B;
  --moss:#9CCB6B; --moss-soft:#22371B; --water:#74B5CA; --water-soft:#17313A;
  --ok:#7ACB91; --ok-soft:#163322; --bad:#EC8F77; --bad-soft:#3B1E17;
  --bone:#E9E6DC; --dead:#7A7466; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,5vw,3.6rem)}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem)}
h3{font-size:1.3rem}
p{margin:0}
b,strong{font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 18px;padding-block:10px}
.teacher{font-family:var(--f-display);font-size:1.15rem;color:var(--ink)}
.brand{font-family:var(--f-display);font-size:1.15rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.brand span{color:var(--moss)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;min-width:0;flex-basis:100%;margin-left:-11px}
nav.tabs a{flex:none;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:.92rem;white-space:nowrap}
nav.tabs a:hover{background:var(--moss-soft);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.ring{width:16px;height:16px;flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--moss);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
nav.tabs a[aria-current="page"] .ring .bg{stroke:color-mix(in srgb,var(--paper) 35%,transparent)}

main{padding-block:36px 80px}
.view[hidden]{display:none}

/* hero ladder */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:36px;align-items:center}
.hero .lead{font-size:1.15rem;color:var(--ink-2);max-width:52ch;margin-top:14px}
.ladder{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;counter-reset:lv}
.ladder button{border:1px solid var(--line);background:var(--sheet);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.95rem;display:flex;gap:7px;align-items:baseline}
.ladder button .n{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.8rem}
.ladder button[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--sheet)}
.ladder button[aria-pressed="true"] .n{color:inherit;opacity:.8}
.lvinfo{margin-top:18px;min-height:7.5em;border-left:3px solid var(--moss);padding:4px 0 4px 16px;max-width:60ch}
.lvinfo h3{font-size:1.5rem}
.lvinfo .lvex{color:var(--ink-2);margin-top:6px;font-style:italic}
#rings{width:100%;max-width:420px;height:auto;display:block;margin:auto}
#rings circle{fill:transparent;stroke:var(--line);stroke-width:1.5;transition:fill .35s,stroke .35s;cursor:pointer}
#rings circle.in{fill:color-mix(in srgb,var(--moss) 9%,transparent);stroke:color-mix(in srgb,var(--moss) 55%,var(--line))}
#rings circle.on{stroke:var(--moss);stroke-width:3.5}
#rings text{font-family:var(--f-body);font-size:13px;fill:var(--ink);text-anchor:middle;pointer-events:none}

.chapters{margin-top:56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.chap{display:block;text-decoration:none;color:inherit;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.chap:hover{border-color:var(--moss)}
.chap .num{font-family:var(--f-display);font-size:1.9rem;color:var(--moss);line-height:1}
.chap h3{margin-top:8px;font-size:1.15rem}
.chap p{color:var(--ink-2);font-size:.92rem;margin-top:4px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:3px;width:0;transition:width .4s}
.howto{margin-top:44px;max-width:64ch;color:var(--ink-2)}
.howto h3{color:var(--ink);margin-bottom:6px}

/* chapter */
.chead{max-width:760px}
.chead .num{font-family:var(--f-display);color:var(--moss);font-size:1.1rem}
.chead p{font-size:1.12rem;color:var(--ink-2);margin-top:12px}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.subnav a{font-size:.9rem;color:var(--water);text-decoration:none;border-bottom:1px solid currentColor}
.block{margin-top:44px;max-width:760px}
.block > h2{margin-bottom:6px}
.sum{margin-top:22px;display:grid;gap:12px}
.sum h3{margin-top:14px}
.sum p,.sum li{max-width:68ch}
.sum ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
dfn{font-style:normal;font-weight:700;background:linear-gradient(transparent 62%,var(--moss-soft) 62%)}
.note{font-size:.95rem;color:var(--ink-2);border-left:3px solid var(--water);padding-left:12px}

/* flashcards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:16px;max-width:1000px}
.card{perspective:900px;border:none;background:none;padding:0;cursor:pointer;min-height:132px;text-align:left}
.card .in{position:relative;display:block;width:100%;height:100%;min-height:132px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.card .f{background:var(--sheet);border:1px solid var(--line);font-family:var(--f-display);font-size:1.2rem}
.card .f small{font-family:var(--f-body);font-size:.78rem;color:var(--ink-2);margin-top:8px}
.card .b{background:var(--moss-soft);border:1px solid var(--moss);transform:rotateY(180deg);font-size:.93rem;line-height:1.45}

/* exercises */
.ex-list{display:grid;gap:18px;margin-top:18px;max-width:1000px}
.ex{min-width:0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.ex.done{border-color:var(--ok)}
.exh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.exh h3{font-size:1.18rem;max-width:62ch}
.exh .tag{font-size:.8rem;color:var(--ink-2);display:block;font-family:var(--f-body);margin-bottom:2px}
.chip{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--paper);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.ex.done .chip{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.ex .q{margin-top:8px;color:var(--ink-2);max-width:68ch}
.ex-body{margin-top:14px}
.row{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .t{flex:1 1 280px;min-width:0}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--paper);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:.92rem}
.opt:hover{border-color:var(--water)}
.opt[aria-pressed="true"]{background:var(--water);color:var(--sheet);border-color:var(--water)}
.row.ok .opt[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.row.bad .opt[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.fb{flex-basis:100%;font-size:.92rem;padding:6px 10px;border-radius:7px}
.fb.ok{background:var(--ok-soft);color:var(--ink)}
.fb.bad{background:var(--bad-soft);color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:none;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn:hover{opacity:.9}
.msg{font-size:.95rem}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
select{font:inherit;font-size:.93rem;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
.row.ok select{border-color:var(--ok);background:var(--ok-soft)}
.row.bad select{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:90px;font:inherit;font-size:.95rem;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
.model{margin-top:12px;background:var(--moss-soft);border-radius:8px;padding:12px 14px;font-size:.95rem}
.model b{display:block;margin-bottom:2px}

/* order */
.pool,.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border-radius:8px}
.pool{background:var(--paper)}
.answer{border:1.5px dashed var(--line);margin-top:10px;flex-direction:column;align-items:stretch}
.answer:empty::before{content:"Tik de stappen hierboven aan in de juiste volgorde.";color:var(--ink-2);font-size:.92rem}
.tok{border:1px solid var(--line);background:var(--sheet);padding:6px 12px;border-radius:7px;cursor:pointer;text-align:left;font-size:.93rem}
.answer .tok{display:flex;gap:10px}
.answer .tok .i{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:1.2em}
.answer .tok.ok{border-color:var(--ok);background:var(--ok-soft)}
.answer .tok.bad{border-color:var(--bad);background:var(--bad-soft)}

/* table */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:380px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:700;font-size:.9rem;color:var(--ink-2)}
td.c,th.c{text-align:center}
td.ok{background:var(--ok-soft)} td.bad{background:var(--bad-soft)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--water)}

/* explore */
.explore{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px}
.explore .list{display:flex;flex-direction:column;gap:6px}
.explore .panel{background:var(--paper);border-radius:8px;padding:14px 16px;min-height:120px}
.explore .panel h4{font-family:var(--f-display);font-weight:400;font-size:1.2rem;margin:0 0 6px}
.explore .panel dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.explore .panel dt{color:var(--ink-2);font-size:.9rem}
.explore .panel dd{margin:0}

/* pyramid */
.pyr{display:grid;gap:6px;margin-top:12px}
.pyr .lv{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:.92rem}
.pyr .lv .bw{display:flex;justify-content:center}
.pyr .lv .b{height:30px;background:var(--moss);border-radius:4px;min-width:3px;transition:width .3s}
.pyr .lv:nth-child(2) .b{background:color-mix(in srgb,var(--moss) 75%,var(--water))}
.pyr .lv:nth-child(3) .b{background:color-mix(in srgb,var(--moss) 45%,var(--water))}
.pyr .lv:nth-child(4) .b{background:var(--water)}
.pyr .lv .v{font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{width:100%;accent-color:var(--moss)}
input[type=number]{font:inherit;width:9em;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}

/* svg diagrams */
.diagram{overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:560px;height:auto}
.node rect{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.node text{font-family:var(--f-body);font-size:14px;fill:var(--ink);text-anchor:middle}
.arr{cursor:pointer}
.arr line{stroke-width:3.5}
.arr .hit{stroke:transparent;stroke-width:22}
.arr text{font-family:var(--f-body);font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--sheet);stroke-width:5px;stroke-linejoin:round}
.arr.dim{opacity:.25}
.arr.hl line{stroke-width:6}
.k-fix{stroke:var(--water);fill:var(--water)}
.k-ass{stroke:var(--moss);fill:var(--moss)}
.k-nit{stroke:#C98A1B;fill:#C98A1B}
.k-amm{stroke:var(--bad);fill:var(--bad)}
.k-dood{stroke:var(--ink-2);fill:var(--ink-2)}
.arr text.k-fix,.arr text.k-ass,.arr text.k-nit,.arr text.k-amm,.arr text.k-dood{stroke:var(--sheet)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.infobox{margin-top:12px;background:var(--paper);border-radius:8px;padding:12px 14px;min-height:72px}

/* coral */
.coral{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:center}
.coral svg{width:100%;max-width:300px;height:auto}
.coral .st{font-family:var(--f-display);font-size:1.5rem}
.c-branch{transition:stroke .6s}
.state-gezond .c-branch{stroke:var(--moss)}
.state-gezond .c-pol{fill:#E0A33A;opacity:1}
.state-verbleekt .c-branch{stroke:var(--bone)}
.state-verbleekt .c-pol{fill:var(--bone);opacity:.7}
.state-dood .c-branch{stroke:var(--dead)}
.state-dood .c-pol{opacity:0}
.c-alg{opacity:0;transition:opacity .6s;fill:var(--moss)}
.state-dood .c-alg{opacity:.8}
.c-pol{transition:fill .6s,opacity .6s}

/* glossary */
.gl-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.gl-tools input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);flex:1 1 240px;min-width:0}
.gl{margin-top:16px;display:grid;gap:0;max-width:820px}
.gl div{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl dt{font-weight:700}
.gl dd{margin:0}
.gl .h{font-size:.8rem;color:var(--ink-2)}

/* toets */
.quiz{max-width:760px}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.qcard .qn{color:var(--ink-2);font-size:.9rem;font-variant-numeric:tabular-nums}
.qcard h3{margin:6px 0 14px}
.qopts{display:grid;gap:8px}
.qopt{border:1px solid var(--line);background:var(--paper);text-align:left;padding:10px 14px;border-radius:8px;cursor:pointer}
.qopt:hover{border-color:var(--water)}
.qopt.ok{background:var(--ok-soft);border-color:var(--ok)}
.qopt.bad{background:var(--bad-soft);border-color:var(--bad)}
.qopt:disabled{cursor:default}
.score{font-family:var(--f-display);font-size:3rem;color:var(--moss)}

.foot{margin-top:60px;color:var(--ink-2);font-size:.85rem;max-width:70ch}

@media (max-width:820px){
  .top{position:static}
  .hero{grid-template-columns:1fr}
  #rings{max-width:300px}
  .explore,.coral{grid-template-columns:1fr}
  .pyr .lv{grid-template-columns:110px minmax(0,1fr) 80px}
  .gl div{grid-template-columns:1fr;gap:2px}
}
@media (max-width:560px){
  body{font-size:16px}
  .ex{padding:16px}
}

/* oefenarena (spellen) */
.ar-top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.ar-pts{display:flex;gap:8px;flex-wrap:wrap}
.ar-pill{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ar-pill b{color:var(--moss)}
.ar-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px}
.ar-tabs button{border:1px solid var(--line);background:var(--sheet);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.95rem}
.ar-tabs button[aria-selected="true"]{background:var(--moss);border-color:var(--moss);color:var(--sheet)}
.ar-game{margin-top:16px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;max-width:1000px}
.ar-head{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline}
.ar-head p{flex-basis:100%;color:var(--ink-2);max-width:68ch;margin-top:6px}
.ar-meta{color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem}
.ar-fb{min-height:1.5em;font-weight:700;margin-top:10px;font-size:.95rem}
.ar-fb.ok{color:var(--ok)} .ar-fb.no{color:var(--bad)}
.ar-mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:620px){.ar-mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ar-card{min-height:108px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:transparent;cursor:pointer;padding:8px;font-size:.86rem;line-height:1.3;position:relative}
.ar-card::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.8rem;color:color-mix(in srgb,var(--paper) 45%,transparent)}
.ar-card.open,.ar-card.done{background:var(--paper);color:var(--ink);cursor:default}
.ar-card.open::after,.ar-card.done::after{content:none}
.ar-card.term{font-family:var(--f-display);font-size:1.02rem}
.ar-card.done{background:var(--ok-soft);border-color:var(--ok)}
.ar-card.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ar-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1.5px dashed var(--line);border-radius:8px;margin-top:14px}
.ar-chip{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;cursor:pointer;text-align:left;max-width:100%;font-size:.93rem}
.ar-chip.sel{border-color:var(--water);background:var(--water-soft)}
.ar-chip.placed{cursor:default;background:var(--ok-soft);border-color:transparent;font-size:.88rem;padding:5px 9px}
.ar-buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.ar-bucket{border:1.5px solid var(--moss);border-radius:8px;padding:10px;min-height:100px;background:transparent;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ar-bucket h4{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:1.05rem;color:var(--moss)}
.ar-bucket.flash{border-color:var(--bad);background:var(--bad-soft)}
@keyframes ar-shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ar-shake{animation:ar-shake .3s}
.ar-riddle{background:var(--moss-soft);border-radius:8px;padding:14px 16px;margin-top:14px}

{ id:"h1", num:"1", title:"De geslachtskenmerken", short:"Biologisch geslacht, primaire en secundaire geslachtskenmerken, puberteit",
  lead:"Wat bepaalt je biologisch geslacht, en welke hormonen zorgen tijdens de puberteit voor de grote veranderingen?",
  summary:`
  <h3>1.1 Biologisch geslacht</h3>
  <p>Het <dfn>geslacht</dfn> of de sekse is het onderscheid tussen organismen op basis van de voortplantingscellen die ze maken. Bij de mens ligt het biologische geslacht vast in het DNA en wordt het bepaald door twee <dfn>geslachtschromosomen</dfn>: <b>XX</b> bij vrouwen (eicellen) en <b>XY</b> bij mannen (zaadcellen).</p>
  <p>Sommige mensen worden geboren met een DNA- of chromosoomvariatie waardoor het biologische geslacht niet eenduidig is: ze hebben een <dfn>intersekse</dfn> lichaam, met een variatie van mannelijke én vrouwelijke geslachtskenmerken. Dat stel je soms vast bij de geboorte, soms pas later (bv. als de menstruatie uitblijft). Ongeveer 1,7 % van de mensen is intersekse: ongeveer evenveel als mensen met groene ogen.</p>
  <p><i>In de cursus gebruiken we ‘vrouw’ voor mensen met een baarmoeder en vagina die menstrueren, en ‘man’ voor mensen met een penis en eventueel functionele teelballen, ook al identificeert niet iedereen met die kenmerken zich zo.</i></p>
  <h3>1.2 Primaire geslachtskenmerken</h3>
  <p><dfn>Primaire geslachtskenmerken</dfn> zijn lichamelijke kenmerken die al bij de geboorte aanwezig zijn.</p>
  <ul>
    <li><b>Man – uitwendig:</b> balzak met teelballen en bijballen, penis met eikel en voorhuid. <b>Inwendig:</b> zaadleiders, zaadblaasjes, prostaatklier, urogenitale buis.</li>
    <li><b>Vrouw – uitwendig:</b> schaamlippen, clitoris, geslachtsopening. <b>Inwendig:</b> eierstokken, eileiders met eitrechters, baarmoeder met baarmoederhals, vagina.</li>
  </ul>
  <h3>1.3 Puberteit en secundaire geslachtskenmerken</h3>
  <p>De <dfn>puberteit</dfn> is de periode waarin kinderen zich ontwikkelen tot volwassenen. <dfn>Secundaire geslachtskenmerken</dfn> ontstaan tijdens de puberteit onder invloed van de geslachtshormonen uit de geslachtsklieren of <dfn>gonaden</dfn>.</p>
  <p>Vóór de puberteit wordt de <b>hypothalamus</b> geremd. Rond 10 à 12 jaar valt die remming weg: de hypothalamus maakt meer <dfn>GnRH</dfn> (gonadotrofine-releasing hormoon). Daardoor maakt de <b>hypofyse</b> <dfn>LH</dfn> (luteïniserend hormoon) en <dfn>FSH</dfn> (follikelstimulerend hormoon). Via het bloed activeren die de geslachtsklieren.</p>
  <ul>
    <li><b>Jongens:</b> LH stimuleert de teelballen om <dfn>testosteron</dfn> te maken; FSH versterkt dat en start de aanmaak van zaadcellen. Kenmerken: beharing, bredere schouders, groei van penis en balzak, meer spieren en een sterker skelet, stemverlaging, aanmaak van zaadcellen en zaadlozing.</li>
    <li><b>Meisjes:</b> FSH laat follikels groeien in de eierstokken; FSH en LH zorgen dat de eierstokken <dfn>oestrogeen</dfn> en <dfn>progesteron</dfn> maken. Kenmerken: breder bekken, rondere vormen door onderhuids vet, borstontwikkeling, lichte groei van de schaamlippen, eicelrijping en menstruatiecyclus.</li>
  </ul>
  <p><b>Feedbackmechanismen</b> regelen hoeveel LH en FSH er in het bloed is. Het samenspel heet de <dfn>hypothalamus-hypofyse-as</dfn>. Ook de bijnieren maken kleine hoeveelheden geslachtshormonen.</p>
  <h3>1.4 Na de vruchtbare periode</h3>
  <p>Vanaf ongeveer 42 jaar neemt de vruchtbaarheid bij vrouwen af. De <dfn>overgang</dfn> is het proces waarbij het lichaam van vruchtbaar naar onvruchtbaar gaat, omdat de oestrogeenproductie in de eierstokken wegvalt (klachten: onregelmatige cyclus, warmteopwellingen). De <dfn>menopauze</dfn> markeert de laatste menstruatiecyclus. Bij mannen daalt het testosteron geleidelijk; ook in die <dfn>andropauze</dfn> kunnen overgangsverschijnselen optreden.</p>`,
  cards:[["Geslachtschromosomen","XX bij vrouwen, XY bij mannen."],["Intersekse","Variatie in DNA of chromosomen waardoor het biologisch geslacht niet eenduidig is."],["Primaire geslachtskenmerken","Lichamelijke kenmerken die al bij de geboorte aanwezig zijn."],["Secundaire geslachtskenmerken","Kenmerken die ontstaan tijdens de puberteit onder invloed van geslachtshormonen."],["Gonaden","Geslachtsklieren: teelballen en eierstokken."],["GnRH","Hormoon van de hypothalamus dat de hypofyse aanzet tot LH en FSH."],["LH en FSH","Hormonen van de hypofyse die de geslachtsklieren activeren."],["Overgang","Het lichaam gaat van vruchtbaar naar onvruchtbaar."],["Menopauze","De periode die de laatste menstruatiecyclus markeert."]],

/* ---------------- FOCUS GESLACHT VS GENDER ---------------- */
{ id:"gen", num:"Focus", title:"Geslacht versus gender", short:"Genderidentiteit, genderexpressie en genderoriëntatie",
  lead:"Je biologisch geslacht is één ding. Hoe je je voelt, je uit en tot wie je je aangetrokken voelt, is nog iets anders.",
  summary:`
  <p>Het <dfn>biologische geslacht</dfn> is het totaal van de lichamelijke kenmerken die bepalen of je een man of een vrouw bent. Geslachtshormonen beïnvloeden ook de ontwikkeling van de hersenen. <b>Tertiaire geslachtskenmerken</b> gaan over hoe we denken, doen en ons voelen.</p>
  <p><dfn>Gender</dfn> omvat de ideeën en normen in de samenleving over wat mannelijk of vrouwelijk is: geen biologische, maar maatschappelijke, sociale en culturele aspecten. Die verschillen van plaats tot plaats en veranderen in de tijd: vandaag vinden we blauw een jongenskleur en roze een meisjeskleur, vóór 1940 was dat net omgekeerd.</p>
  <ul>
    <li><dfn>Genderidentiteit</dfn> (psychologisch geslacht): hoe je je eigen geslacht beleeft: man, vrouw, allebei of geen van beide. Komt ze overeen met je biologisch geslacht, dan ben je <b>cisgender</b>. Anderen voelen zich bv. agender, genderneutraal, non-binair, genderfluïde of transgender. <b>Genderdiversiteit</b> is de overkoepelende term. Bij een diep gevoel van onbehagen spreek je van <b>genderdysforie</b>.</li>
    <li><dfn>Genderexpressie</dfn>: hoe je genderidentiteit tot uiting komt, bv. door kleding, spraak en gedrag. <b>Gender-non-conform</b> gedrag gaat in tegen de maatschappelijke verwachtingen.</li>
    <li><dfn>Genderoriëntatie</dfn>: de seksuele en romantische aantrekking die je voelt tot anderen. Vaak vallen die samen, maar niet bij iedereen.</li>
  </ul>
  <p>Het letterwoord <b>LGBTQIA+</b> toont de diversiteit in gender en seksuele oriëntatie.</p>`,

/* ---------------- HOOFDSTUK 2.1 ---------------- */
{ id:"zaad", num:"2.1", title:"De zaadcel", short:"Hormonale regeling bij mannen, bouw van de zaadcel, ejaculatie",
  lead:"Hoe regelen hormonen de aanmaak van zaadcellen, en hoe is een zaadcel gebouwd voor haar taak?",
  summary:`
  <h3>Aanmaak van zaadcellen</h3>
  <p>Zaadcellen worden aangemaakt in de <b>teelballen</b> (testes). Vanaf de puberteit maakt de hypothalamus GnRH, waardoor de hypofyse LH en FSH maakt. Het bloed brengt ze naar de teelballen. Elke teelbal bestaat uit lobben met dunne <b>zaadbuisjes</b>.</p>
  <ul>
    <li>Tussen de zaadbuisjes liggen de <dfn>cellen van Leydig</dfn>: onder invloed van <b>LH</b> maken ze <b>testosteron</b>.</li>
    <li>In de wand van de zaadbuisjes liggen de <dfn>cellen van Sertoli</dfn>: <b>FSH</b> zet ze aan tot het maken van <b>bindingseiwitten</b>.</li>
  </ul>
  <p>Testosteron en bindingseiwitten regelen de aanmaak van zaadcellen via <dfn>negatieve terugkoppeling</dfn>: is er genoeg, dan remmen ze de hypothalamus en de hypofyse, zodat er minder LH en FSH wordt gemaakt.</p>
  <p>De aanmaak start bij <b>kiemcellen</b> in de wand van de zaadbuisjes. De bindingseiwitten zorgen dat testosteron aan de kiemcellen bindt. Kiemcellen delen razendsnel in vier nieuwe cellen, die een zwemstaart krijgen. Ze zwemmen naar de <b>bijballen</b>, waar ze uitrijpen. De zaadcelvorming verloopt best bij <b>35 °C</b>: spiertjes in de balzak brengen de teelballen dichter bij of verder van het lichaam.</p>
  <h3>Bouw van de zaadcel</h3>
  <p>Een zaadcel is maar 0,005 mm groot, een van de kleinste cellen van de mens. Ze bestaat uit drie delen:</p>
  <ul>
    <li>de <b>kop</b> met de <b>celkern</b> (erfelijk materiaal) en vooraan het <b>acrosomaal blaasje</b> met enzymen om de eicel binnen te dringen;</li>
    <li>het <b>middenstuk</b>, rijk aan <b>mitochondriën</b> die energie leveren (het centriool vormt de overgang);</li>
    <li>de <b>zweepstaart</b> die de zaadcel vooruitstuwt.</li>
  </ul>
  <h3>Ejaculatie</h3>
  <p>De zaadcellen blijven in de bijbal tot de <dfn>zaadlozing</dfn> of ejaculatie. De twee zaadleiders verbinden de bijballen met de urogenitale buis. Onderweg komen er <b>zaadvocht</b> (uit de zaadblaasjes) en <b>prostaatvocht</b> (uit de prostaatklier) bij. Zaadcellen + zaadvocht + prostaatvocht = <dfn>sperma</dfn>. Per zaadlozing komen gemiddeld zo’n 142 miljoen zaadcellen via de baarmoederhals in de baarmoeder; ze zwemmen naar de eileiders. Gezonde zaadcellen overleven drie tot vijf dagen.</p>
  <p><i>Anabole steroïden zijn van testosteron afgeleide hormonen die spieropbouw bevorderen, maar ook acne, onvruchtbaarheid, een lager libido en depressie kunnen veroorzaken.</i></p>`,
  cards:[["Cellen van Leydig","Maken testosteron onder invloed van LH."],["Cellen van Sertoli","Maken bindingseiwitten onder invloed van FSH."],["Negatieve terugkoppeling","Genoeg hormoon remt de verdere aanmaak van de sturende hormonen."],["Acrosomaal blaasje","Bevat enzymen om de eicel binnen te dringen."],["Middenstuk","Rijk aan mitochondriën die energie leveren."],["Sperma","Zaadcellen + zaadvocht + prostaatvocht."]],

/* ---------------- HOOFDSTUK 2.2 ---------------- */
{ id:"eicel", num:"2.2", title:"De eicel en de menstruatiecyclus", short:"Eicelrijping, eisprong en de 28-daagse cyclus",
  lead:"Hoe rijpt een eicel, en welke hormonen sturen de menstruatiecyclus?",
  summary:`
  <h3>Aanmaak en bouw van de eicel</h3>
  <p>Al bij de ongeboren baby delen kiemcellen in de eierstokken tot <b>onrijpe eicellen</b>, omgeven door follikelcellen: <dfn>primaire follikels</dfn>. Bij de geboorte zijn er een miljoen; door degeneratie blijven er bij de start van de puberteit nog zo’n 250 000 over.</p>
  <p>Vanaf de puberteit rijpt er maandelijks één primaire follikel uit. Die maakt <b>oestrogeen</b>, het aantal follikelcellen neemt toe en er ontstaat een holte met follikelvocht: een rijpe of <dfn>graafse follikel</dfn>. Bij de <dfn>eisprong</dfn> (ovulatie) barst de follikel open en vloeit de eicel mee in de eitrechter. De overblijvende follikelcellen vormen het <dfn>geel lichaam</dfn>, dat oestrogeen en vooral <b>progesteron</b> maakt.</p>
  <p>Met 0,1 mm is de eicel een van de grootste cellen van de mens: veel cytoplasma met centraal het erfelijk materiaal, een beschermende laag (<b>zona pellucida</b>) en een voedende laag (<b>corona radiata</b>). Ze beweegt niet zelf, maar door trilhaartjes en de peristaltiek van de eileider. Na de eisprong is de eicel ongeveer <b>12 uur</b> zeer vruchtbaar; wordt ze niet bevrucht, dan sterft ze af. Het geel lichaam blijft twee weken bestaan en krimpt tot een litteken.</p>
  <h3>De menstruatiecyclus (gemiddeld 28 dagen)</h3>
  <p>Er zijn drie deelcycli: de hypothalamus-hypofysecyclus, de eierstokcyclus en de baarmoedercyclus. Bekijk ze samen in de interactieve cyclus op de startpagina.</p>
  <p><b>Folliculaire fase (dag 1–14).</b> De oestrogeenconcentratie is laag, dus de hypothalamus maakt GnRH en de hypofyse meer FSH dan LH: één primaire follikel rijpt. De follikelcellen maken steeds meer oestrogeen: het baarmoederslijmvlies wordt dikker en krijgt meer bloedvaten (<b>groeifase</b>). Rond <b>dag 10</b> remt oestrogeen via negatieve terugkoppeling de FSH-productie, zodat er geen nieuwe eicel begint te rijpen. Rond <b>dag 12</b> bereikt oestrogeen een <b>drempelwaarde</b>: positieve terugkoppeling naar de hypothalamus geeft extra GnRH en een piek van LH en FSH. De <b>LH-piek</b> veroorzaakt de eisprong.</p>
  <p><b>Luteale fase (dag 14–28).</b> Er is meer LH dan FSH. Het geel lichaam maakt oestrogeen en steeds meer progesteron. Progesteron doet de lichaamstemperatuur met gemiddeld 0,5 °C stijgen en laat het dikke slijmvlies voedingsrijk vocht afscheiden (<b>secretiefase</b>); de baarmoederwand is nu zo’n 8 mm dik. Oestrogeen en progesteron remmen de hypothalamus. Zonder bevruchting krimpt het geel lichaam, dalen de hormonen en breekt rond dag 28 het slijmvlies af.</p>
  <p><b>Menstruatiefase (dag 1–5).</b> Minimale oestrogeen- en progesteronconcentraties; het slijmvlies breekt af met bloedverlies. De eerste dag van het bloedverlies is dag 1 van de cyclus.</p>`,
  cards:[["Primaire follikel","Onrijpe eicel omgeven door follikelcellen."],["Graafse follikel","Rijpe follikel met een holte vol follikelvocht."],["Eisprong (ovulatie)","De rijpe follikel barst open en de eicel komt vrij."],["Geel lichaam","Resten van de graafse follikel; maakt oestrogeen en vooral progesteron."],["Zona pellucida","Beschermende laag rond de eicel."],["Corona radiata","Voedende laag van follikelcellen rond de eicel."],["Folliculaire fase","Dag 1–14: rijping van de eicel."],["Luteale fase","Dag 14–28: na de eisprong, geel lichaam actief."],["Positieve terugkoppeling","Oestrogeen boven de drempelwaarde stimuleert extra GnRH, LH en FSH."]],

{ id:"zwang", num:"2.3", title:"Bevruchting en zwangerschap", short:"Zygote, innesteling, hCG en placenta",
  lead:"Wat gebeurt er als een zaadcel een eicel bevrucht, en welke hormonen houden de zwangerschap in stand?",
  summary:`
  <p>Zijn er zaadcellen in de eileider op het moment van de eisprong, dan kan er een <dfn>bevruchting</dfn> plaatsvinden, binnen de 24 uur na de eisprong. Slechts één zaadcel dringt de eicel binnen; meteen verandert de zona pellucida in een ondoordringbaar <b>bevruchtingsmembraan</b>. De kern van de zaadcel versmelt met die van de eicel: een bevruchte eicel of <dfn>zygote</dfn>.</p>
  <p>Zo’n 24 uur later deelt de zygote een eerste keer; daarna volgen de delingen elkaar steeds sneller op. Na drie à vier dagen komt het hoopje stamcellen in de baarmoeder aan. De buitenste cellaag zorgt voor de <dfn>innesteling</dfn> in het baarmoederslijmvlies: vanaf dan spreek je van een <dfn>embryo</dfn>. Lukt de innesteling, dan blijft de menstruatie uit: een zwangerschap.</p>
  <p>Het embryo maakt <dfn>hCG</dfn> (humaan choriongonadotrofine). Dat zorgt dat het geel lichaam progesteron en oestrogeen blijft maken, zodat het baarmoederslijmvlies niet afbreekt. Een zwangerschapstest meet hCG in de urine; hCG veroorzaakt ook ochtendmisselijkheid.</p>
  <p>Na <b>10 weken</b> zijn alle organen gevormd: een <dfn>foetus</dfn>. Rond <b>12 weken</b> zijn navelstreng en <dfn>placenta</dfn> voldoende ontwikkeld en neemt de placenta de productie van progesteron en oestrogeen over. Ongeveer 38 weken na de bevruchting wordt de baby geboren; artsen rekenen met 40 weken (de eicelrijping meegeteld).</p>
  <p><i>Bij een buitenbaarmoederlijke zwangerschap nestelt de zygote zich in de eileider in plaats van in de baarmoeder.</i></p>`,

{ id:"anti", num:"Menu", title:"Jongeren en anticonceptie", short:"Hoe voorkom je een zwangerschap en een soa?",
  lead:"Met wat je weet over de hormonale regeling begrijp je ook hoe anticonceptiemiddelen werken.",
  summary:`
  <p><dfn>Anticonceptie</dfn> zijn alle middelen en methodes om een zwangerschap te voorkomen. Ze werken op een van drie manieren: ze <b>verhinderen de eisprong</b>, ze <b>houden de zaadcellen tegen</b> of ze <b>verhinderen de innesteling</b>.</p>
  <h3>Hormonale middelen</h3>
  <ul>
    <li><b>Anticonceptiepil (combinatiepil)</b>: bevat synthetisch oestrogeen en progestageen (een stof die werkt zoals progesteron). Net zoals in de luteale fase remmen die hormonen de hypothalamus en de hypofyse via <b>negatieve terugkoppeling</b>: er komt weinig FSH en LH vrij, er rijpt geen follikel en er is <b>geen eisprong</b>. Het slijm in de baarmoederhals wordt ook dikker. Je neemt ze elke dag; in de stopweek dalen de hormonen en volgt een onttrekkingsbloeding. Vergeten, braken of diarree maken de pil minder betrouwbaar.</li>
    <li>Dezelfde hormonen kunnen ook via een <b>vaginale ring</b>, een <b>pleister</b>, een <b>prikpil</b> of een <b>staafje (implantaat)</b> in de bovenarm worden toegediend.</li>
    <li><b>Hormoonspiraal</b>: een T-vormig plastic spiraaltje in de baarmoeder dat jarenlang een kleine hoeveelheid progestageen afgeeft; het slijm in de baarmoederhals laat geen zaadcellen meer door.</li>
  </ul>
  <h3>Niet-hormonale middelen</h3>
  <ul>
    <li><b>Condoom</b>: een barrière die het sperma opvangt. Het is het <b>enige middel dat ook beschermt tegen seksueel overdraagbare aandoeningen (soa’s)</b>.</li>
    <li><b>Koperspiraal</b>: koper is schadelijk voor zaadcellen en verhindert de innesteling. Geen hormonen.</li>
    <li><b>Natuurlijke methodes</b> zoals de kalendermethode of ‘terugtrekken’ zijn <b>weinig betrouwbaar</b>: de eisprong valt niet altijd op dezelfde dag, zaadcellen overleven tot 5 dagen en voorvocht kan al zaadcellen bevatten.</li>
  </ul>
  <h3>Noodanticonceptie</h3>
  <p>Na onbeschermd vrijen of een gescheurd condoom kan de <dfn>morning-afterpil</dfn> (noodpil). Neem ze zo snel mogelijk, ten laatste enkele dagen na het vrijen (afhankelijk van het type 3 tot 5 dagen). Ze <b>stelt de eisprong uit</b>. Het is geen abortuspil en geen gewoon anticonceptiemiddel.</p>
  <p>Wie zowel een zwangerschap als een soa wil vermijden, combineert een condoom met de pil: <b>dubbele bescherming</b>. Een arts, apotheker of het CLB helpt je de juiste keuze maken.</p>
  <p class="note"><i>Dit menu staat niet uitgeschreven in het leerwerkboek; de leerstof sluit aan bij het doel ‘het correct gebruik van anticonceptiemiddelen illustreren’.</i></p>`,

const G=(d,m,s,a)=>a*Math.exp(-((d-m)*(d-m))/(2*s*s));
const HORM={
  FSH:{c:"var(--water)",f:d=>0.18+G(d,3,4,0.25)+G(d,13.5,0.9,0.42)+G(d,28,2,0.15)},
  LH:{c:"var(--bad)",f:d=>0.15+G(d,13.6,0.7,0.85)+G(d,21,6,0.08)},
  oestrogeen:{c:"var(--moss)",f:d=>0.1+G(d,12.3,2.2,0.72)+G(d,21,3.2,0.38)},
  progesteron:{c:"#B07A3A",f:d=>0.04+G(d,21,3.4,0.8)}
};
let PREG=false;
const P0=21; // innesteling ± dag 21
function hv(k,d){ const o=HORM[k]; if(!PREG||d<=P0) return o.f(d);
  if(k==="progesteron") return Math.min(0.98,o.f(P0)+0.02*(d-P0));
  if(k==="oestrogeen") return o.f(P0)+0.012*(d-P0);
  return Math.min(o.f(d),o.f(P0)); }
function wall(d){ if(PREG&&d>P0) return Math.min(0.95,0.845+0.015*(d-P0)); if(d<=5) return 0.55-0.4*(d-1)/4; if(d<=14) return 0.15+0.45*(d-5)/9; if(d<=24) return 0.6+0.35*(d-14)/10; return 0.95-0.05*(d-24)/4; }

  const a = h(`<div class="actions"><button type="button" class="btn">Controleer</button>${onReset?'<button type="button" class="btn ghost">Opnieuw</button>':""}<span class="msg" aria-live="polite"></span></div>`);

  const all = good===total;

    },
    sort(){
      stage.innerHTML=`<div class="ar-game"><div class="ar-head"><h2 id="s-title">Sorteerrace</h2><span class="ar-meta" id="s-meta"></span><p>Tik op een kaartje en daarna op de juiste kolom. Elke fout kost een punt; ben je binnen de minuut klaar, dan krijg je 2 bonuspunten.</p></div>
        <div class="actions"><label for="s-pick" class="ar-meta">Onderwerp</label><select id="s-pick"></select><button type="button" class="btn" id="s-next">Volgende ronde</button></div>
        <div class="ar-pool" id="s-pool" aria-label="Te sorteren kaartjes"></div><div class="ar-buckets" id="s-buckets"></div><div class="ar-fb" id="s-fb" aria-live="polite"></div></div>`;
      const sel=$("#s-pick",stage); AR_SETS.forEach((s,i)=>sel.appendChild(h(`<option value="${i}">${s.t}</option>`)));
      let st={idx:-1};
      function meta(){ $("#s-meta",stage).textContent=`Nog ${st.left} · Fouten ${st.err} · ${Math.round((Date.now()-st.t0)/1000)} s`; }
      function start(idx){
        if(idx===undefined) idx=(st.idx+1)%AR_SETS.length;
        const s=AR_SETS[idx]; st={idx,set:s,left:s.i.length,err:0,sel:null,t0:Date.now()}; sel.value=idx;
        $("#s-title",stage).textContent=s.t; $("#s-fb",stage).textContent="";
        const pool=$("#s-pool",stage); pool.innerHTML="";
        shuffle(s.i).forEach(it=>{ const b=document.createElement("button"); b.type="button"; b.className="ar-chip"; b.textContent=it[0]; b.dataset.c=it[1];
          b.addEventListener("click",()=>{ if(b.classList.contains("placed")) return; stage.querySelectorAll(".ar-chip.sel").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); st.sel=b; }); pool.appendChild(b); });
        const bk=$("#s-buckets",stage); bk.innerHTML="";
        s.c.forEach((c,ci)=>{ const d=document.createElement("button"); d.type="button"; d.className="ar-bucket"; d.innerHTML=`<h4>${c}</h4>`; d.setAttribute("aria-label","Kolom "+c); d.addEventListener("click",()=>drop(ci,d)); bk.appendChild(d); });
        clearInterval(timer); timer=setInterval(()=>{ if(!document.body.contains(stage)) return clearInterval(timer); meta(); },500); meta();
      }
      function drop(ci,d){
        const b=st.sel, m=$("#s-fb",stage); if(!b){ fb(m,false,"Tik eerst op een kaartje."); return; }
        if(+b.dataset.c===ci){ b.classList.remove("sel"); b.classList.add("placed"); d.appendChild(b); st.sel=null; st.left--; fb(m,true,"Juist!");
          if(st.left===0){ clearInterval(timer); const sec=Math.round((Date.now()-st.t0)/1000); const p=Math.max(1,st.set.i.length-st.err+(sec<60?2:0)); pts(p);
            fb(m,true,`Ronde klaar in ${sec} s met ${st.err} fout(en): +${p} punten.${sec<60?" (snelheidsbonus +2)":""}`); } }
        else { st.err++; d.classList.add("flash","ar-shake"); b.classList.add("ar-shake"); setTimeout(()=>{ d.classList.remove("flash","ar-shake"); b.classList.remove("ar-shake"); },400);
          fb(m,false,`‘${b.textContent}’ hoort niet bij ${st.set.c[ci]}. Probeer opnieuw.`); }
        meta();
      }
      sel.addEventListener("change",()=>start(+sel.value)); $("#s-next",stage).addEventListener("click",()=>start()); start(0);
    },
    who(){
      stage.innerHTML=`<div class="ar-game"><div class="ar-head"><h2>Wie ben ik?</h2><span class="ar-meta" id="w-meta"></span><p>Raad het organisme, proces of begrip. Na één hint verdien je 3 punten, na twee hints 2 punten, na drie hints 1 punt.</p></div>
        <div class="ar-riddle"><ol id="w-hints"></ol></div><div class="actions"><button type="button" class="btn ghost" id="w-hint">Volgende hint</button></div>
        <div class="ar-opts" id="w-opts"></div><div class="ar-fb" id="w-fb" aria-live="polite"></div><div class="actions"><button type="button" class="btn" id="w-next">Volgend raadsel</button></div></div>`;
      let st={order:[],k:-1,shown:1,done:false};
      function draw(){ const r=AR_WHO[st.order[st.k]]; $("#w-hints",stage).innerHTML=r.h.map((x,i)=>i<st.shown?`<li>${x}</li>`:`<li class="hid" aria-hidden="true">verborgen hint</li>`).join("");
        $("#w-hint",stage).disabled=st.done||st.shown>=3; $("#w-meta",stage).textContent=`Raadsel ${st.k+1}/${AR_WHO.length} · waard ${4-st.shown} pt`; }
      function next(){
        if(!st.order.length||st.k>=st.order.length-1){ st.order=shuffle(AR_WHO.map((_,i)=>i)); st.k=-1; }
        st.k++; st.shown=1; st.done=false; const r=AR_WHO[st.order[st.k]]; $("#w-fb",stage).textContent=""; draw();
        const o=$("#w-opts",stage); o.innerHTML="";
        shuffle(r.o).forEach(t=>{ const b=document.createElement("button"); b.type="button"; b.textContent=t; b.addEventListener("click",()=>answer(b,t,r)); o.appendChild(b); });
      }
      function answer(b,t,r){ if(st.done) return; const m=$("#w-fb",stage);
        if(t===r.a){ st.done=true; b.classList.add("ok"); const p=4-st.shown; pts(p); st.shown=3; draw(); fb(m,true,`Juist, het is ${r.a}! +${p} punten.`); }
        else { b.classList.add("no"); b.disabled=true;
          if(st.shown<3){ st.shown++; draw(); fb(m,false,"Niet juist. Je krijgt een extra hint."); }
          else { st.done=true; stage.querySelectorAll("#w-opts button").forEach(x=>{ if(x.textContent===r.a) x.classList.add("ok"); }); draw(); fb(m,false,`Helaas, het juiste antwoord is ${r.a}.`); } } }
      $("#w-hint",stage).addEventListener("click",()=>{ if(st.shown<3){ st.shown++; draw(); } });
      $("#w-next",stage).addEventListener("click",next); next();
    },
    chain(){
      stage.innerHTML=`<div class="ar-game"><div class="ar-head"><h2 id="c-title">Kettingreactie</h2><span class="ar-meta" id="c-meta"></span><p id="c-q"></p></div>
        <ol class="ar-chain" id="c-list"></ol><div class="actions"><button type="button" class="btn" id="c-check">Controleer</button><button type="button" class="btn ghost" id="c-next">Volgende ketting</button></div><div class="ar-fb" id="c-fb" aria-live="polite"></div></div>`;
      let st={k:-1,cur:[],checked:false};
      function draw(marks){ const ol=$("#c-list",stage); ol.innerHTML="";
        st.cur.forEach((s,i)=>{ const li=document.createElement("li"); if(marks) li.className=marks[i]?"ok":"no";
          li.innerHTML=`<span class="n" aria-hidden="true"></span><span class="t"></span>`; $(".t",li).textContent=s;
          const up=h(`<button type="button" class="ar-mv">↑</button>`), dn=h(`<button type="button" class="ar-mv">↓</button>`);
          up.setAttribute("aria-label","Omhoog: "+s); dn.setAttribute("aria-label","Omlaag: "+s); up.disabled=i===0||st.checked; dn.disabled=i===st.cur.length-1||st.checked;
          up.addEventListener("click",()=>{ [st.cur[i-1],st.cur[i]]=[st.cur[i],st.cur[i-1]]; draw(); ol.children[i-1].querySelector(".ar-mv").focus(); });
          dn.addEventListener("click",()=>{ [st.cur[i+1],st.cur[i]]=[st.cur[i],st.cur[i+1]]; draw(); ol.children[i+1].querySelectorAll(".ar-mv")[1].focus(); });
          li.append(up,dn); ol.appendChild(li); }); }
      function next(){ st.k=(st.k+1)%AR_CHAINS.length; const c=AR_CHAINS[st.k]; let cur; do{ cur=shuffle(c.s); }while(cur.every((x,i)=>x===c.s[i]));
        st.cur=cur; st.checked=false; $("#c-title",stage).textContent=c.t; $("#c-q",stage).textContent=c.q+" Zet de stappen in de juiste volgorde met de pijltjes en controleer. Elke stap op de juiste plaats = 1 punt.";
        $("#c-fb",stage).textContent=""; $("#c-check",stage).disabled=false; $("#c-meta",stage).textContent=`Ketting ${st.k+1}/${AR_CHAINS.length}`; draw(); }
      $("#c-check",stage).addEventListener("click",()=>{ if(st.checked) return; const c=AR_CHAINS[st.k]; const marks=st.cur.map((s,i)=>s===c.s[i]); const n=marks.filter(Boolean).length;
        st.checked=true; draw(marks); pts(n); $("#c-check",stage).disabled=true;
        fb($("#c-fb",stage),n===c.s.length, n===c.s.length?`Perfect! +${n} punten.`:`${n} van de ${c.s.length} stappen staan juist: +${n} punten. Juiste volgorde: ${c.s.join(" → ")}`); });
      $("#c-next",stage).addEventListener("click",next); next();
    }
  };
  const tabs=v.querySelectorAll(".ar-tabs button");
  function open(g){ arTab=g; clearInterval(timer); tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.g===g)); GAMES[g](); }
  v.querySelector(".ar-tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) open(b.dataset.g); });
  open(arTab);
}

/* ---------- ROUTER ---------- */
let current="start";
function route(){
  const id=(location.hash||"#start").slice(1);
  const ch=CH.find(c=>c.id===id);
  current = ch?id:(["begrippen","toets","arena"].includes(id)?id:"start");
  const app=$("#app"); app.innerHTML="";
  if(ch) renderChapter(app,ch); else if(current==="begrippen") renderGloss(app); else if(current==="toets") renderQuiz(app); else if(current==="arena") renderArena(app); else renderStart(app);
  renderTabs(current); window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
