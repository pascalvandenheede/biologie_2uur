<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>.home-link{font-family:var(--f-body);font-size:.92rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 11px;white-space:nowrap;margin-right:auto}.home-link:hover{color:var(--ink);border-color:var(--moss);background:var(--moss-soft)}</style>

<title>Ecologie Thema 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
<style>
/* Layout: veldschrift — één hoofdstuk tegelijk, smalle leeskolom, oefeningen als losse werkbladen eronder */
:root{
  --paper:#EAF0EC; --sheet:#F8FBF9; --ink:#12302A; --ink-2:#4B6761; --line:#C6D6CE;
  --moss:#4C7D27; --moss-soft:#DAE8CC; --water:#2A6C84; --water-soft:#D3E6ED;
  --ok:#2C7A47; --ok-soft:#D5EDDC; --bad:#B0442D; --bad-soft:#F5DCD5;
  --bone:#F3F1EA; --dead:#8D8676;
  --f-display:"Young Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1A17; --sheet:#132420; --ink:#E1ECE6; --ink-2:#9BB3AB; --line:#29423B;
  --moss:#9CCB6B; --moss-soft:#22371B; --water:#74B5CA; --water-soft:#17313A;
  --ok:#7ACB91; --ok-soft:#163322; --bad:#EC8F77; --bad-soft:#3B1E17;
  --bone:#E9E6DC; --dead:#7A7466; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1A17; --sheet:#132420; --ink:#E1ECE6; --ink-2:#9BB3AB; --line:#29423B;
  --moss:#9CCB6B; --moss-soft:#22371B; --water:#74B5CA; --water-soft:#17313A;
  --ok:#7ACB91; --ok-soft:#163322; --bad:#EC8F77; --bad-soft:#3B1E17;
  --bone:#E9E6DC; --dead:#7A7466; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,5vw,3.6rem)}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem)}
h3{font-size:1.3rem}
p{margin:0}
b,strong{font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 18px;padding-block:10px}
.teacher{font-family:var(--f-display);font-size:1.15rem;color:var(--ink)}
.brand{font-family:var(--f-display);font-size:1.15rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.brand span{color:var(--moss)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;min-width:0;flex-basis:100%;margin-left:-11px}
nav.tabs a{flex:none;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:.92rem;white-space:nowrap}
nav.tabs a:hover{background:var(--moss-soft);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.ring{width:16px;height:16px;flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--moss);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
nav.tabs a[aria-current="page"] .ring .bg{stroke:color-mix(in srgb,var(--paper) 35%,transparent)}

main{padding-block:36px 80px}
.view[hidden]{display:none}

/* hero ladder */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:36px;align-items:center}
.hero .lead{font-size:1.15rem;color:var(--ink-2);max-width:52ch;margin-top:14px}
.ladder{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;counter-reset:lv}
.ladder button{border:1px solid var(--line);background:var(--sheet);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.95rem;display:flex;gap:7px;align-items:baseline}
.ladder button .n{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.8rem}
.ladder button[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--sheet)}
.ladder button[aria-pressed="true"] .n{color:inherit;opacity:.8}
.lvinfo{margin-top:18px;min-height:7.5em;border-left:3px solid var(--moss);padding:4px 0 4px 16px;max-width:60ch}
.lvinfo h3{font-size:1.5rem}
.lvinfo .lvex{color:var(--ink-2);margin-top:6px;font-style:italic}
#rings{width:100%;max-width:420px;height:auto;display:block;margin:auto}
#rings circle{fill:transparent;stroke:var(--line);stroke-width:1.5;transition:fill .35s,stroke .35s;cursor:pointer}
#rings circle.in{fill:color-mix(in srgb,var(--moss) 9%,transparent);stroke:color-mix(in srgb,var(--moss) 55%,var(--line))}
#rings circle.on{stroke:var(--moss);stroke-width:3.5}
#rings text{font-family:var(--f-body);font-size:13px;fill:var(--ink);text-anchor:middle;pointer-events:none}

.chapters{margin-top:56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.chap{display:block;text-decoration:none;color:inherit;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.chap:hover{border-color:var(--moss)}
.chap .num{font-family:var(--f-display);font-size:1.9rem;color:var(--moss);line-height:1}
.chap h3{margin-top:8px;font-size:1.15rem}
.chap p{color:var(--ink-2);font-size:.92rem;margin-top:4px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:3px;width:0;transition:width .4s}
.howto{margin-top:44px;max-width:64ch;color:var(--ink-2)}
.howto h3{color:var(--ink);margin-bottom:6px}

/* chapter */
.chead{max-width:760px}
.chead .num{font-family:var(--f-display);color:var(--moss);font-size:1.1rem}
.chead p{font-size:1.12rem;color:var(--ink-2);margin-top:12px}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.subnav a{font-size:.9rem;color:var(--water);text-decoration:none;border-bottom:1px solid currentColor}
.block{margin-top:44px;max-width:760px}
.block > h2{margin-bottom:6px}
.sum{margin-top:22px;display:grid;gap:12px}
.sum h3{margin-top:14px}
.sum p,.sum li{max-width:68ch}
.sum ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
dfn{font-style:normal;font-weight:700;background:linear-gradient(transparent 62%,var(--moss-soft) 62%)}
.note{font-size:.95rem;color:var(--ink-2);border-left:3px solid var(--water);padding-left:12px}

/* flashcards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:16px;max-width:1000px}
.card{perspective:900px;border:none;background:none;padding:0;cursor:pointer;min-height:132px;text-align:left}
.card .in{position:relative;display:block;width:100%;height:100%;min-height:132px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.card .f{background:var(--sheet);border:1px solid var(--line);font-family:var(--f-display);font-size:1.2rem}
.card .f small{font-family:var(--f-body);font-size:.78rem;color:var(--ink-2);margin-top:8px}
.card .b{background:var(--moss-soft);border:1px solid var(--moss);transform:rotateY(180deg);font-size:.93rem;line-height:1.45}

/* exercises */
.ex-list{display:grid;gap:18px;margin-top:18px;max-width:1000px}
.ex{min-width:0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.ex.done{border-color:var(--ok)}
.exh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.exh h3{font-size:1.18rem;max-width:62ch}
.exh .tag{font-size:.8rem;color:var(--ink-2);display:block;font-family:var(--f-body);margin-bottom:2px}
.chip{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--paper);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.ex.done .chip{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.ex .q{margin-top:8px;color:var(--ink-2);max-width:68ch}
.ex-body{margin-top:14px}
.row{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .t{flex:1 1 280px;min-width:0}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--paper);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:.92rem}
.opt:hover{border-color:var(--water)}
.opt[aria-pressed="true"]{background:var(--water);color:var(--sheet);border-color:var(--water)}
.row.ok .opt[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.row.bad .opt[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.fb{flex-basis:100%;font-size:.92rem;padding:6px 10px;border-radius:7px}
.fb.ok{background:var(--ok-soft);color:var(--ink)}
.fb.bad{background:var(--bad-soft);color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:none;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn:hover{opacity:.9}
.msg{font-size:.95rem}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
select{font:inherit;font-size:.93rem;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
.row.ok select{border-color:var(--ok);background:var(--ok-soft)}
.row.bad select{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:90px;font:inherit;font-size:.95rem;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
.model{margin-top:12px;background:var(--moss-soft);border-radius:8px;padding:12px 14px;font-size:.95rem}
.model b{display:block;margin-bottom:2px}

/* order */
.pool,.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border-radius:8px}
.pool{background:var(--paper)}
.answer{border:1.5px dashed var(--line);margin-top:10px;flex-direction:column;align-items:stretch}
.answer:empty::before{content:"Tik de stappen hierboven aan in de juiste volgorde.";color:var(--ink-2);font-size:.92rem}
.tok{border:1px solid var(--line);background:var(--sheet);padding:6px 12px;border-radius:7px;cursor:pointer;text-align:left;font-size:.93rem}
.answer .tok{display:flex;gap:10px}
.answer .tok .i{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:1.2em}
.answer .tok.ok{border-color:var(--ok);background:var(--ok-soft)}
.answer .tok.bad{border-color:var(--bad);background:var(--bad-soft)}

/* table */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:380px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:700;font-size:.9rem;color:var(--ink-2)}
td.c,th.c{text-align:center}
td.ok{background:var(--ok-soft)} td.bad{background:var(--bad-soft)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--water)}

/* explore */
.explore{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px}
.explore .list{display:flex;flex-direction:column;gap:6px}
.explore .panel{background:var(--paper);border-radius:8px;padding:14px 16px;min-height:120px}
.explore .panel h4{font-family:var(--f-display);font-weight:400;font-size:1.2rem;margin:0 0 6px}
.explore .panel dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.explore .panel dt{color:var(--ink-2);font-size:.9rem}
.explore .panel dd{margin:0}

/* pyramid */
.pyr{display:grid;gap:6px;margin-top:12px}
.pyr .lv{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:.92rem}
.pyr .lv .bw{display:flex;justify-content:center}
.pyr .lv .b{height:30px;background:var(--moss);border-radius:4px;min-width:3px;transition:width .3s}
.pyr .lv:nth-child(2) .b{background:color-mix(in srgb,var(--moss) 75%,var(--water))}
.pyr .lv:nth-child(3) .b{background:color-mix(in srgb,var(--moss) 45%,var(--water))}
.pyr .lv:nth-child(4) .b{background:var(--water)}
.pyr .lv .v{font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{width:100%;accent-color:var(--moss)}
input[type=number]{font:inherit;width:9em;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}

/* svg diagrams */
.diagram{overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:560px;height:auto}
.node rect{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.node text{font-family:var(--f-body);font-size:14px;fill:var(--ink);text-anchor:middle}
.arr{cursor:pointer}
.arr line{stroke-width:3.5}
.arr .hit{stroke:transparent;stroke-width:22}
.arr text{font-family:var(--f-body);font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--sheet);stroke-width:5px;stroke-linejoin:round}
.arr.dim{opacity:.25}
.arr.hl line{stroke-width:6}
.k-fix{stroke:var(--water);fill:var(--water)}
.k-ass{stroke:var(--moss);fill:var(--moss)}
.k-nit{stroke:#C98A1B;fill:#C98A1B}
.k-amm{stroke:var(--bad);fill:var(--bad)}
.k-dood{stroke:var(--ink-2);fill:var(--ink-2)}
.arr text.k-fix,.arr text.k-ass,.arr text.k-nit,.arr text.k-amm,.arr text.k-dood{stroke:var(--sheet)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.infobox{margin-top:12px;background:var(--paper);border-radius:8px;padding:12px 14px;min-height:72px}

/* coral */
.coral{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:center}
.coral svg{width:100%;max-width:300px;height:auto}
.coral .st{font-family:var(--f-display);font-size:1.5rem}
.c-branch{transition:stroke .6s}
.state-gezond .c-branch{stroke:var(--moss)}
.state-gezond .c-pol{fill:#E0A33A;opacity:1}
.state-verbleekt .c-branch{stroke:var(--bone)}
.state-verbleekt .c-pol{fill:var(--bone);opacity:.7}
.state-dood .c-branch{stroke:var(--dead)}
.state-dood .c-pol{opacity:0}
.c-alg{opacity:0;transition:opacity .6s;fill:var(--moss)}
.state-dood .c-alg{opacity:.8}
.c-pol{transition:fill .6s,opacity .6s}

/* glossary */
.gl-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.gl-tools input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);flex:1 1 240px;min-width:0}
.gl{margin-top:16px;display:grid;gap:0;max-width:820px}
.gl div{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl dt{font-weight:700}
.gl dd{margin:0}
.gl .h{font-size:.8rem;color:var(--ink-2)}

/* toets */
.quiz{max-width:760px}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.qcard .qn{color:var(--ink-2);font-size:.9rem;font-variant-numeric:tabular-nums}
.qcard h3{margin:6px 0 14px}
.qopts{display:grid;gap:8px}
.qopt{border:1px solid var(--line);background:var(--paper);text-align:left;padding:10px 14px;border-radius:8px;cursor:pointer}
.qopt:hover{border-color:var(--water)}
.qopt.ok{background:var(--ok-soft);border-color:var(--ok)}
.qopt.bad{background:var(--bad-soft);border-color:var(--bad)}
.qopt:disabled{cursor:default}
.score{font-family:var(--f-display);font-size:3rem;color:var(--moss)}

.foot{margin-top:60px;color:var(--ink-2);font-size:.85rem;max-width:70ch}

@media (max-width:820px){
  .top{position:static}
  .hero{grid-template-columns:1fr}
  #rings{max-width:300px}
  .explore,.coral{grid-template-columns:1fr}
  .pyr .lv{grid-template-columns:110px minmax(0,1fr) 80px}
  .gl div{grid-template-columns:1fr;gap:2px}
}
@media (max-width:560px){
  body{font-size:16px}
  .ex{padding:16px}
}

/* oefenarena (spellen) */
.ar-top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.ar-pts{display:flex;gap:8px;flex-wrap:wrap}
.ar-pill{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ar-pill b{color:var(--moss)}
.ar-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px}
.ar-tabs button{border:1px solid var(--line);background:var(--sheet);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.95rem}
.ar-tabs button[aria-selected="true"]{background:var(--moss);border-color:var(--moss);color:var(--sheet)}
.ar-game{margin-top:16px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;max-width:1000px}
.ar-head{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline}
.ar-head p{flex-basis:100%;color:var(--ink-2);max-width:68ch;margin-top:6px}
.ar-meta{color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem}
.ar-fb{min-height:1.5em;font-weight:700;margin-top:10px;font-size:.95rem}
.ar-fb.ok{color:var(--ok)} .ar-fb.no{color:var(--bad)}
.ar-mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:620px){.ar-mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ar-card{min-height:108px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:transparent;cursor:pointer;padding:8px;font-size:.86rem;line-height:1.3;position:relative}
.ar-card::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.8rem;color:color-mix(in srgb,var(--paper) 45%,transparent)}
.ar-card.open,.ar-card.done{background:var(--paper);color:var(--ink);cursor:default}
.ar-card.open::after,.ar-card.done::after{content:none}
.ar-card.term{font-family:var(--f-display);font-size:1.02rem}
.ar-card.done{background:var(--ok-soft);border-color:var(--ok)}
.ar-card.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ar-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1.5px dashed var(--line);border-radius:8px;margin-top:14px}
.ar-chip{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;cursor:pointer;text-align:left;max-width:100%;font-size:.93rem}
.ar-chip.sel{border-color:var(--water);background:var(--water-soft)}
.ar-chip.placed{cursor:default;background:var(--ok-soft);border-color:transparent;font-size:.88rem;padding:5px 9px}
.ar-buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.ar-bucket{border:1.5px solid var(--moss);border-radius:8px;padding:10px;min-height:100px;background:transparent;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ar-bucket h4{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:1.05rem;color:var(--moss)}
.ar-bucket.flash{border-color:var(--bad);background:var(--bad-soft)}
@keyframes ar-shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ar-shake{animation:ar-shake .3s}
.ar-riddle{background:var(--moss-soft);border-radius:8px;padding:14px 16px;margin-top:14px}
.ar-riddle ol{margin:0;padding-left:1.4em;display:grid;gap:6px}
.ar-riddle li.hid{color:transparent;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--moss) 30%,transparent) 0 10px,transparent 10px 14px);border-radius:4px;list-style:none;margin-left:-1.4em;padding-left:1.4em}
.ar-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:12px}
.ar-opts button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:11px;cursor:pointer;font-weight:700}
.ar-opts button.ok{border-color:var(--ok);background:var(--ok-soft)}
.ar-opts button.no{border-color:var(--bad);background:var(--bad-soft)}
.ar-chain{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;counter-reset:s}
.ar-chain li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--paper)}
.ar-chain li .n{counter-increment:s;font-family:var(--f-display);color:var(--moss);width:1.6em;text-align:center;flex:none}
.ar-chain li .n::before{content:counter(s)}
.ar-chain li .t{flex:1;min-width:0}
.ar-chain li.ok{border-color:var(--ok);background:var(--ok-soft)}
.ar-chain li.no{border-color:var(--bad)}
.ar-mv{border:1px solid var(--line);background:var(--sheet);border-radius:7px;width:38px;height:38px;cursor:pointer;flex:none}
.ar-mv:disabled{opacity:.3;cursor:default}
.chap.arena{border-color:var(--moss);background:var(--moss-soft)}
@media (prefers-reduced-motion:reduce){.ar-shake{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

{ id:"h1", num:"1", title:"Ecosystemen", short:"Organisatieniveaus, biotoop, habitat en niche",
  lead:"Van één cel tot de hele biosfeer: welke organisatieniveaus onderscheid je, en wat is het verschil tussen een biotoop, een habitat en een niche?",
  summary:`
  <h3>1.1 Van organisme tot ecosysteem</h3>
  <p>Organismen van dezelfde soort in één gebied, die met elkaar in contact kunnen komen, vormen een <dfn>populatie</dfn>. Alle populaties van verschillende soorten die elkaar beïnvloeden, vormen samen een <dfn>levensgemeenschap</dfn>. Neem je ook de invloed van de <dfn>abiotische factoren</dfn> (licht, temperatuur, water …) mee, dan spreek je van een <dfn>ecosysteem</dfn>: het geheel van interacties tussen biotische en abiotische factoren in een biotoop.</p>
  <p><dfn>Biodiversiteit</dfn> is de verscheidenheid van het leven in al zijn vormen: verschillende ecosystemen, verschillende soorten en genetische variatie. Ze is niet gelijk verdeeld over de aarde. <dfn>Ecologie</dfn> is de wetenschap die de wisselwerking tussen organismen en hun biotoop bestudeert.</p>
  <h3>1.2 Ecosystemen op grote en kleine schaal</h3>
  <p>Ecosystemen hebben meestal geen duidelijke grenzen. Het grootste is de <dfn>biosfeer</dfn>, met de lithosfeer (vaste aardkorst), de hydrosfeer (al het water) en de atmosfeer (lucht). Maar ook het Amazoneregenwoud, één bromelia of zelfs één waterdruppel op een blad is een ecosysteem, zolang er biotische én abiotische factoren op de levensgemeenschap inwerken.</p>
  <ul>
    <li><b>Abiotische kenmerken</b> zoals lichtsterkte, temperatuur en vochtigheid bepalen vooral welke <b>planten</b> er groeien.</li>
    <li><b>Biotische kenmerken</b> zoals de dichtheid van het bladerdek, voedsel en nestgelegenheid bepalen vooral welke <b>dieren</b> er leven.</li>

  <h3>1.3 Biotoop, habitat en niche</h3>
  <p>Een <dfn>biotoop</dfn> is een min of meer gelijkmatig gebied met eigen fysische en chemische kenmerken en een typische levensgemeenschap, bv. een poel. Bij een biotoop kijk je naar alle factoren die aanwezig zijn; bij een ecosysteem ligt de nadruk op de interacties.</p>
  <p>Een <dfn>habitat</dfn> is de plaats die optimaal is voor één soort om te overleven, te groeien en zich voort te planten. Het leefgebied van een soort kan meerdere habitats in verschillende biotopen omvatten. De gewone pad gebruikt een poel als voortplantingshabitat, moerassen en vochtige graslanden als zomerhabitat en vorstvrije plekken in de strooisellaag of onder de grond als winterhabitat.</p>
  <p>De <dfn>ecologische niche</dfn> is de rol of functie van een soort in het ecosysteem. Soorten met een gelijkaardige habitat kunnen naast elkaar leven omdat hun niche verschilt. De kerkuil jaagt ’s nachts op muizen, de torenvalk overdag. De gewone pad legt eieren in lange slierten dieper tussen de planten, de bruine kikker legt klompen kikkerdril in ondiep water.</p>`,

  summary:`
  <h3>2.1 Biodiversiteit in kaart brengen</h3>
  <p>Biodiversiteit is een belangrijke maatstaf voor de <b>natuurkwaliteit</b>. België heeft dankzij het gematigde klimaat en een afwisselend landschap een verrassende biodiversiteit. Typische biotopen worden beschermd in natuurreservaten, zoals de Westhoek, het Zwin en de Hoge Venen.</p>
  <p>Bij een <dfn>terreinstudie</dfn> zoek je eerst de naam van de organismen op: <dfn>determineren</dfn> (kwalitatief). Daarna tel of schat je de aantallen en hun verspreiding: <dfn>inventariseren</dfn> (kwantitatief).</p>
  <p>Omdat je niet alle soorten kunt tellen, onderzoekt men vaak <dfn>indicatorsoorten</dfn>: soorten die door hun aan- of afwezigheid iets vertellen over het milieu.</p>
  <ul>
    <li>Brandnetels wijzen op een stikstofrijke bodem.</li>
    <li>De brede orchis groeit in vochtige graslanden met een mineraalrijke bodem.</li>
    <li>De kokerjuffer overleeft enkel in heel zuiver water.</li>
  </ul>
  <p>Een terreinstudie is een <b>momentopname</b>. Door ze te herhalen kun je de biodiversiteit <b>monitoren</b>. Planten onderzoek je met een <dfn>vegetatieopname</dfn> in een opnamevlak of langs een traject. Dieren inventariseer je <b>rechtstreeks</b> (nestkasten controleren, tellen, vangen) of <b>onrechtstreeks</b> via sporen zoals pootafdrukken, uitwerpselen, haren en dode dieren. Sporen tonen enkel aan- of afwezigheid, geen aantallen. Inventarisatie is nodig om goede <b>beheerplannen</b> op te stellen.</p>
  <h3>2.2 Drie niveaus van biodiversiteit</h3>
  <p><b>A. Ecosystemen.</b> Zonder invloed van de mens spreek je van <dfn>natuurlijke ecosystemen</dfn> (zuidpool, hoge toppen van de Himalaya). De Vlaamse natuurreservaten (zo’n 30 000 ha) zijn <dfn>halfnatuurlijk</dfn>. Wegbermen (bijna 25 000 ha) zijn <dfn>kunstmatige ecosystemen</dfn> door maaien en afvoeren van maaisel, maar bloemrijke bermen zijn waardevol voor vlinders, bijen en hommels en verbinden natuurgebieden met elkaar.</p>
  <p><b>B. Soortniveau.</b> Een bloemrijke wegberm telt veel meer soorten dan de berm van een wandelpad. Daar groeien <dfn>tredplanten</dfn>, aangepast aan een verdichte bodem: straatgras, varkensgras, grote weegbree en madeliefje.</p>
  <p><b>C. Genetisch niveau.</b> Genetische diversiteit is de motor van de natuurlijke selectie. Binnen de soort paardenbloem bestaan wel 250 variëteiten, met bv. rechtopstaande of platte bladeren, lichte of zware zaden en kortere of langere bloemstelen.</p>`,

/* ---------------- FOCUS MADAGASKAR ---------------- */
{ id:"mad", num:"Focus", title:"Bijzondere biodiversiteit op Madagaskar", short:"Endemische soorten en unieke ecosystemen",
  lead:"Een eiland dat al zo’n 90 miljoen jaar losligt van het vasteland, met ecosystemen en soorten die nergens anders voorkomen.",
  summary:`
  <p>Veel soorten op Madagaskar leven daar en nergens anders ter wereld: het zijn <dfn>endemische soorten</dfn>. Zo’n 90 miljoen jaar geleden kwam het eiland volledig los van het Afrikaanse en Indiase vasteland. Daardoor konden de soorten op het eiland onafhankelijk evolueren.</p>
  <h3>Diversiteit aan ecosystemen</h3>
  <p>Een bergketen loopt van noord naar zuid over het eiland. Regenwolken uit de Indische Oceaan worden er omhoog gestuwd, de waterdamp condenseert en het regent in het oosten.</p>
  <ul>
    <li><b>Oosten:</b> veel neerslag, tropisch regenwoud.</li>
    <li><b>Westen:</b> minder neerslag, droge loofbossen en kalksteenformaties.</li>
    <li><b>Zuiden:</b> extreem droog, ‘spiny forest’ met doornige struiken en baobabs (apenbroodbomen).</li>
    <li><b>Zuidwesten:</b> vooral succulenten, die water opslaan in hun organen.</li>
  </ul>
  <h3>Diversiteit aan soorten</h3>
  <p>Er leven 31 soorten <b>tenreks</b>: kleine insectenetende zoogdieren die allemaal uit dezelfde voorouder ontstaan zijn. Door natuurlijke selectie namen ze verschillende niches in en vermeden ze concurrentie. Sommige zijn harig, andere stekelig; sommige lijken op een muis, andere op een otter.</p>
  <p>De <b>ringstaartmaki</b> heeft een lange staart met veertien witte en zwarte ringen. De <b>aye-aye</b> (vingerdier) tikt ’s nachts op boomschors om larven te vinden en haalt ze eruit met zijn lange, dunne middelvinger.</p>`,

{ id:"h3", num:"3", title:"Energiestromen en kringlopen", short:"Voedselkringloop, energiestroom, water, C en N",
  lead:"Energie stroomt door een ecosysteem en verdwijnt als warmte. Stoffen zoals water, koolstof en stikstof gaan rond in kringlopen.",
  summary:`
  <h3>3.1 Voedselkringloop</h3>
  <p>Een <dfn>voedselketen</dfn> toont wie wie eet. Verbonden voedselketens vormen een <dfn>voedselweb</dfn>. De plaats van een organisme in een voedselketen is zijn <dfn>trofisch niveau</dfn>.</p>
  <ul>
    <li><dfn>Producenten</dfn> (autotroof): planten, algen en sommige bacteriën. Met zonlicht doen ze aan <b>fotosynthese</b>: koolstofdioxide + water → glucose + zuurstofgas. Sommige bacteriën gebruiken chemische energie: <b>chemosynthese</b>.</li>
    <li><dfn>Consumenten</dfn> (heterotroof) van de eerste, tweede, derde orde … Herbivoren eten planten, bacterivoren bacteriën, carnivoren enkel dieren en omnivoren planten én dieren.</li>
    <li><dfn>Detritivoren</dfn> (afvaleters) leven van dood organisch materiaal en verkleinen het, zoals de regenworm.</li>
    <li><dfn>Reducenten</dfn> (bacteriën en schimmels) zetten de laatste resten om in mineralen: <dfn>mineralisatie</dfn>. Zo sluit de keten zich tot een <dfn>voedselkringloop</dfn>.</li>
  </ul>
  <p>Voedselketens, -webben en -kringlopen zijn <b>kwalitatief</b>. Een <dfn>ecologische piramide</dfn> is <b>kwantitatief</b>: de piramide van <b>aantallen</b>, van <b>biomassa</b> en van <b>energie</b>. Reducenten staan nooit in een piramide.</p>
  <h3>3.2 Energiestroom</h3>
  <p>Bij elke overgang naar een volgend trofisch niveau wordt gemiddeld maar <b>10 %</b> van de biomassa doorgegeven: zo’n <b>90 % energieverlies</b>. Producenten zetten een klein deel van de stralingsenergie van de zon om in chemische energie. Ongeveer de helft verbruiken ze zelf (<b>celademhaling</b>, de warmte is onbruikbaar), de andere helft wordt eigen biomassa.</p>
  <p><b>Biomassaverlies</b> ontstaat wanneer producenten sterven zonder opgegeten te worden, slechts gedeeltelijk opgegeten worden, of onverteerd het lichaam verlaten in uitwerpselen. Planteneters verliezen meer dan vleeseters, want plantencellen hebben een celwand en zijn moeilijker verteerbaar. De energie in afval gaat naar detritivoren en reducenten.</p>
  <p>Uiteindelijk wordt alle stralingsenergie omgezet in warmte. Daarom spreek je van een <dfn>energiestroom</dfn> en niet van een kringloop. Een voedselkringloop telt nooit meer dan acht schakels.</p>
  <h3>3.3 Materiekringlopen</h3>
  <p><b>Watercyclus.</b> In de <b>korte</b> kringloop verdampt zeewater, condenseert in de koude lucht tot wolken en valt als neerslag terug in zee. In de <b>lange</b> kringloop valt neerslag op land: het water <b>vloeit af</b> naar beken en rivieren (oppervlaktewater, rijk aan mineralen) of <b>sijpelt in</b> als bodemwater en dieper als grondwater (vaak neutraal, arm aan voedingsstoffen). Boven land komt water terug in de lucht door <b>evaporatie</b> en door <b>transpiratie</b> via de huidmondjes van planten. Neerslag is zoet en licht zuur, doordat water met koolstofdioxide koolzuur vormt.</p>
  <p><b>Koolstofcyclus.</b> In de <b>korte</b> kringloop (tot enkele honderden jaren) leggen producenten CO₂ vast via foto- of chemosynthese. Via de voeding gaat koolstof naar consumenten en reducenten. Bij aerobe celademhaling komt CO₂ vrij, bij anaerobe celademhaling (bv. in de darmen van vee) methaangas, dat in de lucht omgezet wordt in CO₂. In de <b>lange</b> kringloop (duizenden tot miljoenen jaren) ligt koolstof opgeslagen in de lithosfeer: als kalksteen, krijt, grafiet en diamant, of bij anaerobe omstandigheden als aardolie, aardgas, steenkool en turf. Door verwering of verbranding komt die koolstof vrij als CO₂.</p>
  <p><b>Stikstofcyclus.</b> De lucht bestaat voor bijna 79 % uit stikstofgas, maar planten en dieren kunnen dat niet gebruiken. Bekijk het schema hieronder voor de vijf processen.</p>`,
  cards:[["Trofisch niveau","Plaats van een organisme in een voedselketen."],["Autotroof","Maakt zelf organische stoffen uit anorganische (producenten)."],["Heterotroof","Haalt organische stoffen uit voedsel (consumenten, reducenten)."],["Detritivoor","Afvaleter die leeft van dood organisch materiaal."],["Reducent","Bacterie of schimmel die organisch afval omzet in mineralen."],["Mineralisatie","Omzetting van organisch materiaal in anorganische stoffen of mineralen."],["Ecologische piramide","Kwantitatieve voorstelling van een voedselketen: aantallen, biomassa of energie."],["Energiestroom","Stralingsenergie gaat via de voedselketen door en wordt uiteindelijk warmte."],["Transpiratie","Water verdampt via de huidmondjes van planten."],["Evaporatie","Verdamping van oppervlaktewater."],["Stikstoffixatie","Stikstofgas omzetten in stikstofverbindingen in de bodem."],["Ammonificatie","Reducenten zetten stikstof in organisch afval om in ammoniak/ammonium."],["Nitrificatie","Bacteriën oxideren ammonium tot nitraat; vraagt zuurstofgas."],["Denitrificatie","Bacteriën in zuurstofarme bodem zetten nitraat om in stikstofgas of ammoniak."]],

{ id:"h4", num:"4", title:"Het belang van ecosystemen voor de mens", short:"Vier soorten ecosysteemdiensten",
  lead:"Wat levert de natuur ons op? Ecosysteemdiensten maken alle voordelen zichtbaar, ook de minder opvallende.",
  summary:`
  <p><dfn>Ecosysteemdiensten</dfn> zijn alle goederen en diensten die de natuur aan de mens levert. Je onderscheidt vier groepen.</p>
  <ul>
    <li><b>Producerende</b>: voordelen die ons leven mogelijk maken, zoals voedsel, drinkbaar water, zuurstofgas, grondstoffen en energie (een moestuin, kippen, zon- en windenergie, fossiele brandstoffen, biomassa uit uitwerpselen).</li>
    <li><b>Culturele</b>: rust, ontspanning en recreatie. Een wandeling in het park maakt je hoofd leeg; patiënten met zicht op groen herstellen sneller.</li>
    <li><b>Regulerende</b>: bescherming tegen natuurlijke bedreigingen. Duinen beschermen tegen stormvloeden, straten met bomen warmen minder op tijdens een hittegolf, insecten en vleermuizen zorgen voor bestuiving, lieveheersbeestjes bestrijden bladluizen.</li>
    <li><b>Ondersteunende</b>: de energiestroom en de voedsel- en materiekringlopen, zoals bodemvorming. Ze zijn nodig voor alle andere diensten.</li>
  </ul>
  <p>Hoe gezonder het ecosysteem, hoe meer voordelen. Er is een <b>wisselwerking</b>: het ecosysteem levert diensten, maar de mens zet ecosystemen steeds meer onder druk.</p>`,

{ id:"h5", num:"5", title:"De invloed van de mens op ecosystemen", short:"Versterkt broeikaseffect en koraalverbleking",
  lead:"De mens verstoort het evenwicht in ecosystemen. Koraalriffen tonen goed wat er dan gebeurt.",
  summary:`
  <p>In een gezond ecosysteem zijn biodiversiteit, energiestroom en materiekringlopen in evenwicht. De mens verstoort dat evenwicht: door de <b>verbranding van fossiele brandstoffen</b> en <b>ontbossing</b> stijgt de concentratie <b>broeikasgassen</b> zoals koolstofdioxide en methaan. Naast het natuurlijke broeikaseffect ontstaat zo een <dfn>versterkt broeikaseffect</dfn>, met wereldwijde <b>klimaatverandering</b>. Pakijs smelt, permafrost ontdooit, gletsjers smelten en droogte en hittegolven veroorzaken bosbranden.</p>
  <h3>Koraalriffen onder druk</h3>
  <p><b>Koraal</b> is een samenleving van een dier, de koraalpoliep, met <b>microalgen</b>. De microalgen leveren via fotosynthese voedingsstoffen en geven het koraal zijn kleur. Het koraal bouwt er een kalkskelet van calciumcarbonaat mee.</p>
  <p>Bij stress, zoals snelle opwarming of afkoeling van het water of een bacteriële ziekte, sterven de microalgen af of worden ze giftig. De poliep stoot ze af, de kleur verdwijnt en het witte kalkskelet komt bloot: <dfn>verbleking</dfn>. Neemt het koraal opnieuw microalgen op, dan overleeft het. Lukt dat niet, dan verhongert het. Koraal sterft pas af als verbleking vaker voorkomt dan de herstelperiode.</p>
  <p>Door opwarming, verzuring, zeespiegelstijging, vervuiling en meer tropische stormen volgen de verblekingen elkaar sneller op. Gespecialiseerde soorten verdwijnen, grote plaatkoralen, sponsen, wieren en algen nemen toe. Tegen 2100 dreigt 90 % van de kleurrijke koraalriffen te verdwijnen.</p>
  <p>Ook de mens voelt de gevolgen, want koraalriffen leveren ecosysteemdiensten: habitat voor vissen (visvangst), kustbescherming tegen golven en erosie, en toerisme.</p>`,

const $ = (s, r=document) => r.querySelector(s);
function h(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function chProgress(ch){ const n=ch.exercises.length; let d=0; ch.exercises.forEach((_,i)=>{ if(P[ch.id+"-"+i]) d++; }); return {d,n}; }
function ringSVG(f){ const c=2*Math.PI*6; return `<svg class="ring" viewBox="0 0 16 16" aria-hidden="true"><circle class="bg" cx="8" cy="8" r="6"/><circle class="fg" cx="8" cy="8" r="6" stroke-dasharray="${(c*f).toFixed(2)} ${c.toFixed(2)}"/></svg>`; }

function renderTabs(cur){
  const nav = $("#tabs");
  let s = `<a href="#start" ${cur==="start"?'aria-current="page"':""}>Start</a>`;
  CH.forEach(ch=>{ const p=chProgress(ch); s += `<a href="#${ch.id}" ${cur===ch.id?'aria-current="page"':""}>${ringSVG(p.d/p.n)}${ch.num==="Focus"?"":ch.num+" "}${TABS[ch.id]}</a>`; });
  s += `<a href="#arena" ${cur==="arena"?'aria-current="page"':""}>Oefenarena</a><a href="#begrippen" ${cur==="begrippen"?'aria-current="page"':""}>Begrippen</a><a href="#toets" ${cur==="toets"?'aria-current="page"':""}>Eindtoets</a>`;
  nav.innerHTML = s;
}

function shell(ex,id,label){
  const w = h(`<article class="ex${P[id]?" done":""}" id="ex-${id}">
    <div class="exh"><h3><span class="tag">Oefening ${label}</span>${ex.title}</h3><span class="chip">${P[id]?"Juist":"Te doen"}</span></div>
    ${ex.q?`<p class="q">${ex.q}</p>`:""}<div class="ex-body"></div></article>`);
  w.done = () => { P[id]=true; save(); w.classList.add("done"); $(".chip",w).textContent="Juist"; renderTabs(current); };
  return w;
}
function actions(w, onCheck, onReset){
  const a = h(`<div class="actions"><button type="button" class="btn">Controleer</button>${onReset?'<button type="button" class="btn ghost">Opnieuw</button>':""}<span class="msg" aria-live="polite"></span></div>`);
  a.children[0].addEventListener("click",()=>onCheck($(".msg",a)));
  if(onReset) a.children[1].addEventListener("click",()=>{ $(".msg",a).textContent=""; $(".msg",a).className="msg"; onReset(); });
  w.appendChild(a); return a;
}
function setMsg(m, good, total, okText){
  const all = good===total;
  m.className = "msg " + (all?"ok":"bad");
  m.textContent = all ? ("Alles juist! " + (okText||"")) : (good + " van " + total + " juist. Pas de rode antwoorden aan.");
  return all;
}

function buildEx(ex,id,label){
  const w = shell(ex,id,label), body=$(".ex-body",w);
  const T = BUILD[ex.type]; T(ex,w,body); return w;
}

const BUILD = {
  classify(ex,w,body){
    const items = shuffle(ex.items);
    items.forEach((it,k)=>{
      const r = h(`<div class="row"><div class="t">${it.t}</div><div class="opts" role="group"></div></div>`);
      ex.buckets.forEach((b,j)=>{ const btn=h(`<button type="button" class="opt" aria-pressed="false">${b}</button>`); btn.addEventListener("click",()=>{ r.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed","false")); btn.setAttribute("aria-pressed","true"); r.dataset.c=j; r.classList.remove("ok","bad"); const f=$(".fb",r); if(f) f.remove(); }); $(".opts",r).appendChild(btn); });
      r.it=it; body.appendChild(r);
    });
    actions(w, m=>{
      let g=0; body.querySelectorAll(".row").forEach(r=>{ const ok = r.dataset.c!==undefined && +r.dataset.c===r.it.b; r.classList.toggle("ok",ok); r.classList.toggle("bad",!ok); if(ok) g++; });
      if(setMsg(m,g,items.length,ex.ok)) w.done();
    }, ()=>{ body.querySelectorAll(".row").forEach(r=>{ delete r.dataset.c; r.classList.remove("ok","bad"); r.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed","false")); }); });
  },
  match(ex,w,body){
    ex.items.forEach((it,k)=>{
      const sid = w.id+"-s"+k;
      const r = h(`<div class="row"><label class="t" for="${sid}">${it.t}</label><select id="${sid}"><option value="">Kies …</option>${ex.options.map((o,j)=>`<option value="${j}">${o}</option>`).join("")}</select></div>`);
      r.it=it; $("select",r).addEventListener("change",()=>r.classList.remove("ok","bad")); body.appendChild(r);
    });
    actions(w, m=>{ let g=0; body.querySelectorAll(".row").forEach(r=>{ const v=$("select",r).value; const ok = v!=="" && +v===r.it.a; r.classList.toggle("ok",ok); r.classList.toggle("bad",!ok); if(ok) g++; }); if(setMsg(m,g,ex.items.length)) w.done(); });
  },
  tf(ex,w,body){
    const state = ex.items.map(()=>null);
    ex.items.forEach((it,k)=>{
      const r = h(`<div class="row"><div class="t">${k+1}. ${it.s}</div><div class="opts"><button type="button" class="opt" aria-pressed="false" data-v="1">Waar</button><button type="button" class="opt" aria-pressed="false" data-v="0">Niet waar</button></div></div>`);
      r.addEventListener("click",e=>{ const b=e.target.closest(".opt"); if(!b) return;
        r.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true");
        const ok = (b.dataset.v==="1")===it.a; state[k]=ok; r.classList.toggle("ok",ok); r.classList.toggle("bad",!ok);
        let f=$(".fb",r); if(!f){ f=h(`<div class="fb"></div>`); r.appendChild(f); }
        f.className="fb "+(ok?"ok":"bad"); f.innerHTML = (ok?"<b>Juist.</b> ":"<b>Niet juist.</b> Denk nog eens na. ") + (ok?it.e:"");
        if(state.every(s=>s===true)) w.done();
      });
      body.appendChild(r);
    });
  },
  mc(ex,w,body){
    const multi = Array.isArray(ex.a); const sel=new Set();
    const box = h(`<div class="qopts" role="group"></div>`);
    ex.o.forEach((o,j)=>{ const b=h(`<button type="button" class="qopt" aria-pressed="false">${String.fromCharCode(97+j)}&ensp;${o}</button>`);
      b.addEventListener("click",()=>{ if(!multi){ sel.clear(); box.querySelectorAll(".qopt").forEach(x=>x.setAttribute("aria-pressed","false")); }
        if(sel.has(j)){ sel.delete(j); b.setAttribute("aria-pressed","false"); } else { sel.add(j); b.setAttribute("aria-pressed","true"); }
        box.querySelectorAll(".qopt").forEach(x=>x.classList.remove("ok","bad")); });
      box.appendChild(b); });
    body.appendChild(box);
    const css = `.qopt[aria-pressed="true"]{border-color:var(--water);box-shadow:inset 0 0 0 1px var(--water)}`;
    if(!document.getElementById("mccss")){ const s=document.createElement("style"); s.id="mccss"; s.textContent=css; document.head.appendChild(s); }
    actions(w, m=>{
      const want = new Set(multi?ex.a:[ex.a]);
      const ok = sel.size===want.size && [...sel].every(x=>want.has(x));
      box.querySelectorAll(".qopt").forEach((b,j)=>{ b.classList.remove("ok","bad"); if(sel.has(j)) b.classList.add(want.has(j)?"ok":"bad"); });
      m.className="msg "+(ok?"ok":"bad");
      m.textContent = sel.size===0 ? "Kies eerst een antwoord." : ok ? "Juist! "+(ex.e||"") : (multi?"Nog niet helemaal juist. Let op: er kunnen meerdere antwoorden juist zijn.":"Niet juist. Probeer opnieuw.");
      if(ok) w.done();
    });
  },
  multi(ex,w,body){
    const t = h(`<div class="tbl"><table><thead><tr><th>Proces</th>${ex.cols.map(c=>`<th class="c">${c} waterkringloop</th>`).join("")}</tr></thead><tbody></tbody></table></div>`);
    ex.rows.forEach((r,k)=>{ const tr=h(`<tr><td>${r.t}</td>${ex.cols.map((c,j)=>`<td class="c"><input type="checkbox" id="${w.id}-${k}-${j}" aria-label="${r.t}, ${c}"></td>`).join("")}</tr>`); $("tbody",t).appendChild(tr); });
    body.appendChild(t);
    t.addEventListener("change",e=>{ const td=e.target.closest("td"); if(td) td.classList.remove("ok","bad"); });
    actions(w, m=>{ let g=0,n=0; ex.rows.forEach((r,k)=>ex.cols.forEach((c,j)=>{ const cb=document.getElementById(`${w.id}-${k}-${j}`); const ok=cb.checked===!!r.a[j]; n++; if(ok) g++; cb.parentElement.classList.toggle("ok",ok&&cb.checked); cb.parentElement.classList.toggle("bad",!ok); })); if(setMsg(m,g,n,"In de korte kringloop komt het water niet op het land terecht.")) w.done(); });
  },
  order(ex,w,body){
    const pool=h(`<div class="pool"></div>`), ans=h(`<ol class="answer" style="list-style:none;margin:10px 0 0"></ol>`);
    body.append(pool,ans);
    function reset(){ pool.innerHTML=""; ans.innerHTML=""; shuffle(ex.items.map((t,i)=>i)).forEach(i=>pool.appendChild(tok(i))); }
    function tok(i){ const b=h(`<button type="button" class="tok" data-i="${i}"><span class="i"></span><span>${ex.items[i]}</span></button>`); return b; }
    function renum(){ ans.querySelectorAll(".tok").forEach((b,k)=>{ $(".i",b).textContent=(k+1)+"."; }); pool.querySelectorAll(".i").forEach(s=>s.textContent=""); }
    pool.addEventListener("click",e=>{ const b=e.target.closest(".tok"); if(b){ const li=document.createElement("li"); li.appendChild(b); ans.appendChild(li); ans.querySelectorAll(".tok").forEach(x=>x.classList.remove("ok","bad")); renum(); } });
    ans.addEventListener("click",e=>{ const b=e.target.closest(".tok"); if(b){ const li=b.parentElement; pool.appendChild(b); li.remove(); ans.querySelectorAll(".tok").forEach(x=>x.classList.remove("ok","bad")); renum(); } });
    reset();
    actions(w, m=>{ const toks=[...ans.querySelectorAll(".tok")]; if(toks.length<ex.items.length){ m.className="msg bad"; m.textContent="Zet eerst alle stappen in je volgorde."; return; }
      let g=0; toks.forEach((b,k)=>{ const ok=+b.dataset.i===k; b.classList.toggle("ok",ok); b.classList.toggle("bad",!ok); if(ok) g++; }); if(setMsg(m,g,toks.length)) w.done(); }, reset);
  },
  open(ex,w,body){
    const id=w.id+"-ta";
    body.appendChild(h(`<div><label for="${id}" class="note" style="display:block;margin-bottom:6px;border:none;padding:0">Schrijf eerst je eigen antwoord.</label><textarea id="${id}"></textarea></div>`));

/* ---------- GLOSSARY ---------- */
function renderGloss(app){
  const v=h(`<section class="view"><div class="chead"><h1>Begrippenlijst</h1><p>Alle kernbegrippen van thema 1. Zoek een woord of filter op hoofdstuk.</p></div>
    <div class="gl-tools"><input type="search" id="gl-q" placeholder="Zoek een begrip, bv. niche" aria-label="Zoek een begrip"><select id="gl-c" aria-label="Filter op hoofdstuk"><option value="">Alle hoofdstukken</option><option value="1">1 Ecosystemen</option><option value="2">2 Biodiversiteit</option><option value="Focus">Focus Madagaskar</option><option value="3">3 Energie &amp; kringlopen</option><option value="4">4 Ecosysteemdiensten</option><option value="5">5 Mens &amp; klimaat</option></select><button type="button" class="btn ghost" id="gl-hide" aria-pressed="false">Verberg betekenissen</button></div>
    <dl class="gl"></dl></section>`);
  app.appendChild(v);
  const dl=$(".gl",v), q=$("#gl-q",v), c=$("#gl-c",v), hide=$("#gl-hide",v); let hidden=false;
  function draw(){ const s=q.value.trim().toLowerCase(); const rows=GLOSS.filter(g=>(!c.value||g[2]===c.value)&&(!s||(g[0]+" "+g[1]).toLowerCase().includes(s))).sort((a,b)=>a[0].localeCompare(b[0],"nl"));
    dl.innerHTML = rows.length ? rows.map(g=>`<div><dt>${g[0]}<br><span class="h">${g[2]==="Focus"?"Focus":"hoofdstuk "+g[2]}</span></dt><dd ${hidden?'style="filter:blur(6px);cursor:pointer" title="Klik om te tonen"':""}>${g[1]}</dd></div>`).join("") : `<p class="note" style="margin-top:12px">Geen begrip gevonden. Probeer een ander woord of kies ‘Alle hoofdstukken’.</p>`; }
  q.addEventListener("input",draw); c.addEventListener("change",draw);
  hide.addEventListener("click",()=>{ hidden=!hidden; hide.setAttribute("aria-pressed",hidden); hide.textContent=hidden?"Toon betekenissen":"Verberg betekenissen"; draw(); });
  dl.addEventListener("click",e=>{ const d=e.target.closest("dd"); if(d) d.style.filter="none"; });
  draw();
}

/* ---------- QUIZ ---------- */
function renderQuiz(app){
  const v=h(`<section class="view quiz"><div class="chead"><h1>Eindtoets thema 1</h1><p>Tien willekeurige vragen over het hele thema. Elke keer dat je start, krijg je andere vragen.</p></div><div class="block" id="qz"></div></section>`);
  app.appendChild(v); const box=$("#qz",v);
  function intro(){ const best=P.best; box.innerHTML=`<div class="qcard"><h3>Klaar om jezelf te testen?</h3><p>${best!=null?`Je beste score tot nu toe: <b>${best}/10</b>.`:"Je hebt de toets nog niet gemaakt."}</p><div class="actions"><button type="button" class="btn" id="qstart">Start de toets</button></div></div>`; $("#qstart",box).addEventListener("click",start); }
  let qs=[], i=0, score=0;
  function start(){ qs=shuffle(POOL).slice(0,10).map(q=>{ const ord=shuffle(q.o.map((_,j)=>j)); return {q:q.q,o:ord.map(j=>q.o[j]),a:ord.indexOf(q.a)}; }); i=0; score=0; ask(); }
  function ask(){ const q=qs[i];
    box.innerHTML=`<div class="qcard"><div class="qn">Vraag ${i+1} van 10</div><div class="bar"><i style="width:${i*10}%"></i></div><h3>${q.q}</h3><div class="qopts">${q.o.map((o,j)=>`<button type="button" class="qopt" data-j="${j}">${o}</button>`).join("")}</div><div class="actions"><span class="msg" aria-live="polite"></span></div></div>`;
    box.querySelector(".qopts").addEventListener("click",e=>{ const b=e.target.closest(".qopt"); if(!b||b.disabled) return; const j=+b.dataset.j; const ok=j===q.a; if(ok) score++;
      box.querySelectorAll(".qopt").forEach((x,k)=>{ x.disabled=true; if(k===q.a) x.classList.add("ok"); }); if(!ok) b.classList.add("bad");
      const m=$(".msg",box); m.className="msg "+(ok?"ok":"bad"); m.textContent= ok?"Juist!":"Niet juist. Het juiste antwoord is groen.";
      const nb=h(`<button type="button" class="btn">${i<9?"Volgende vraag":"Bekijk je score"}</button>`); nb.addEventListener("click",()=>{ i++; i<10?ask():end(); }); $(".actions",box).prepend(nb); nb.focus(); });
  }
  function end(){ if(P.best==null||score>P.best){ P.best=score; save(); }
    const t = score>=8?"Sterk gedaan. Je beheerst dit thema goed.":score>=5?"Goed bezig. Herhaal de hoofdstukken waar je twijfelde.":"Lees de samenvattingen nog eens en maak de oefeningen opnieuw.";
    box.innerHTML=`<div class="qcard"><div class="score">${score}/10</div><p style="margin-top:6px">${t}</p><div class="actions"><button type="button" class="btn" id="qagain">Nieuwe toets</button><a class="btn ghost" href="#start" style="text-decoration:none">Terug naar start</a></div></div>`;
    $("#qagain",box).addEventListener("click",start); }
  intro();
}

/* ---------- OEFENARENA ---------- */
let arTotal=0, arTab="mem";
function renderArena(app){
  const v=h(`<section class="view">
    <div class="ar-top"><div class="chead"><div class="num">Oefenen</div><h1>Oefenarena</h1><p>Vier spellen over het hele thema. Verdien punten en verbeter je record. Je punten worden alleen in deze browser bewaard.</p></div>
      <div class="ar-pts" aria-live="polite"><span class="ar-pill">Punten <b id="ar-total">0</b></span><span class="ar-pill">Record <b id="ar-best">0</b></span></div></div>
    <div class="ar-tabs" role="tablist" aria-label="Spellen">
      <button role="tab" data-g="mem">Begrippen-memory</button><button role="tab" data-g="sort">Sorteerrace</button>
      <button role="tab" data-g="who">Wie ben ik?</button><button role="tab" data-g="chain">Kettingreactie</button></div>
    <div id="ar-stage"></div>
    <p class="foot">Gebaseerd op Focus Biologie 4.2 (Pelckmans), thema 1 Ecologie.</p></section>`);
  app.appendChild(v);
  const stage=$("#ar-stage",v);
  function pts(n){ arTotal=Math.max(0,arTotal+n); $("#ar-total",v).textContent=arTotal; if(arTotal>(P.arenaBest||0)){ P.arenaBest=arTotal; save(); } $("#ar-best",v).textContent=P.arenaBest||0; }
  pts(0);
  let timer=null;
  function fb(el,ok,t){ el.className="ar-fb "+(ok?"ok":"no"); el.textContent=t; }
  const GAMES={
    mem(){
      stage.innerHTML=`<div class="ar-game"><div class="ar-head"><h2>Begrippen-memory</h2><span class="ar-meta" id="m-meta"></span><p>Draai telkens twee kaarten om en zoek bij elk begrip de juiste omschrijving. Hoe minder beurten, hoe meer punten.</p></div><div class="ar-mem" id="m-grid"></div><div class="actions"><button type="button" class="btn" id="m-new">Nieuw spel</button></div><div class="ar-fb" id="m-fb" aria-live="polite"></div></div>`;
      let st;
      function meta(){ $("#m-meta",stage).textContent=`Beurten: ${st.turns} · Paren: ${st.found}/8`; }
      function start(){
        const pick=shuffle(AR_MEM).slice(0,8);
        st={cards:shuffle(pick.flatMap((g,i)=>[{id:i,t:g[0],term:true},{id:i,t:g[1],term:false}])),open:[],turns:0,found:0,lock:false};
        const grid=$("#m-grid",stage); grid.innerHTML=""; $("#m-fb",stage).textContent="";
        st.cards.forEach((c,k)=>{ const b=document.createElement("button"); b.type="button"; b.className="ar-card"+(c.term?" term":""); b.textContent=c.t; b.setAttribute("aria-label","Kaart "+(k+1)+", omgedraaid"); b.addEventListener("click",()=>flip(k,b)); c.el=b; grid.appendChild(b); });
        meta();
      }
      function flip(k,b){
        const c=st.cards[k]; if(st.lock||c.done||st.open.includes(k)) return;
        b.classList.add("open"); b.setAttribute("aria-label",c.t); st.open.push(k); if(st.open.length<2) return;
        st.turns++; const [a,z]=st.open.map(i=>st.cards[i]); const m=$("#m-fb",stage);
        if(a.id===z.id&&a.term!==z.term){ a.done=z.done=true; a.el.classList.add("done"); z.el.classList.add("done"); st.open=[]; st.found++; fb(m,true,"Juist paar!");
          if(st.found===8){ const p=Math.max(4,20-Math.max(0,st.turns-8)); pts(p); fb(m,true,`Alle paren gevonden in ${st.turns} beurten: +${p} punten.`); } }
        else { st.lock=true; a.el.classList.add("wrong"); z.el.classList.add("wrong"); fb(m,false,"Geen paar. Onthoud waar ze liggen.");
          setTimeout(()=>{ [a,z].forEach(c=>{ c.el.classList.remove("open","wrong"); c.el.setAttribute("aria-label","Omgedraaide kaart"); }); st.open=[]; st.lock=false; },1300); }
        meta();
      }
      $("#m-new",stage).addEventListener("click",start); start();
    },
    sort(){
      stage.innerHTML=`<div class="ar-game"><div class="ar-head"><h2 id="s-title">Sorteerrace</h2><span class="ar-meta" id="s-meta"></span><p>Tik op een kaartje en daarna op de juiste kolom. Elke fout kost een punt; ben je binnen de minuut klaar, dan krijg je 2 bonuspunten.</p></div>
        <div class="actions"><label for="s-pick" class="ar-meta">Onderwerp</label><select id="s-pick"></select><button type="button" class="btn" id="s-next">Volgende ronde</button></div>
        <div class="ar-pool" id="s-pool" aria-label="Te sorteren kaartjes"></div><div class="ar-buckets" id="s-buckets"></div><div class="ar-fb" id="s-fb" aria-live="polite"></div></div>`;
      const sel=$("#s-pick",stage); AR_SETS.forEach((s,i)=>sel.appendChild(h(`<option value="${i}">${s.t}</option>`)));
      let st={idx:-1};
      function meta(){ $("#s-meta",stage).textContent=`Nog ${st.left} · Fouten ${st.err} · ${Math.round((Date.now()-st.t0)/1000)} s`; }
      function start(idx){
        if(idx===undefined) idx=(st.idx+1)%AR_SETS.length;
        const s=AR_SETS[idx]; st={idx,set:s,left:s.i.length,err:0,sel:null,t0:Date.now()}; sel.value=idx;
        $("#s-title",stage).textContent=s.t; $("#s-fb",stage).textContent="";
        const pool=$("#s-pool",stage); pool.innerHTML="";
        shuffle(s.i).forEach(it=>{ const b=document.createElement("button"); b.type="button"; b.className="ar-chip"; b.textContent=it[0]; b.dataset.c=it[1];
          b.addEventListener("click",()=>{ if(b.classList.contains("placed")) return; stage.querySelectorAll(".ar-chip.sel").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); st.sel=b; }); pool.appendChild(b); });
        const bk=$("#s-buckets",stage); bk.innerHTML="";
        s.c.forEach((c,ci)=>{ const d=document.createElement("button"); d.type="button"; d.className="ar-bucket"; d.innerHTML=`<h4>${c}</h4>`; d.setAttribute("aria-label","Kolom "+c); d.addEventListener("click",()=>drop(ci,d)); bk.appendChild(d); });
        clearInterval(timer); timer=setInterval(()=>{ if(!document.body.contains(stage)) return clearInterval(timer); meta(); },500); meta();
      }
      function drop(ci,d){
        const b=st.sel, m=$("#s-fb",stage); if(!b){ fb(m,false,"Tik eerst op een kaartje."); return; }
        if(+b.dataset.c===ci){ b.classList.remove("sel"); b.classList.add("placed"); d.appendChild(b); st.sel=null; st.left--; fb(m,true,"Juist!");
          if(st.left===0){ clearInterval(timer); const sec=Math.round((Date.now()-st.t0)/1000); const p=Math.max(1,st.set.i.length-st.err+(sec<60?2:0)); pts(p);
            fb(m,true,`Ronde klaar in ${sec} s met ${st.err} fout(en): +${p} punten.${sec<60?" (snelheidsbonus +2)":""}`); } }
        else { st.err++; d.classList.add("flash","ar-shake"); b.classList.add("ar-shake"); setTimeout(()=>{ d.classList.remove("flash","ar-shake"); b.classList.remove("ar-shake"); },400);
          fb(m,false,`‘${b.textContent}’ hoort niet bij ${st.set.c[ci]}. Probeer opnieuw.`); }
        meta();
      }
      sel.addEventListener("change",()=>start(+sel.value)); $("#s-next",stage).addEventListener("click",()=>start()); start(0);
    },
    who(){
      stage.innerHTML=`<div class="ar-game"><div class="ar-head"><h2>Wie ben ik?</h2><span class="ar-meta" id="w-meta"></span><p>Raad het organisme, proces of begrip. Na één hint verdien je 3 punten, na twee hints 2 punten, na drie hints 1 punt.</p></div>
        <div class="ar-riddle"><ol id="w-hints"></ol></div><div class="actions"><button type="button" class="btn ghost" id="w-hint">Volgende hint</button></div>
        <div class="ar-opts" id="w-opts"></div><div class="ar-fb" id="w-fb" aria-live="polite"></div><div class="actions"><button type="button" class="btn" id="w-next">Volgend raadsel</button></div></div>`;
      let st={order:[],k:-1,shown:1,done:false};
      function draw(){ const r=AR_WHO[st.order[st.k]]; $("#w-hints",stage).innerHTML=r.h.map((x,i)=>i<st.shown?`<li>${x}</li>`:`<li class="hid" aria-hidden="true">verborgen hint</li>`).join("");
        $("#w-hint",stage).disabled=st.done||st.shown>=3; $("#w-meta",stage).textContent=`Raadsel ${st.k+1}/${AR_WHO.length} · waard ${4-st.shown} pt`; }
      function next(){
        if(!st.order.length||st.k>=st.order.length-1){ st.order=shuffle(AR_WHO.map((_,i)=>i)); st.k=-1; }
        st.k++; st.shown=1; st.done=false; const r=AR_WHO[st.order[st.k]]; $("#w-fb",stage).textContent=""; draw();
        const o=$("#w-opts",stage); o.innerHTML="";
        shuffle(r.o).forEach(t=>{ const b=document.createElement("button"); b.type="button"; b.textContent=t; b.addEventListener("click",()=>answer(b,t,r)); o.appendChild(b); });
      }
      function answer(b,t,r){ if(st.done) return; const m=$("#w-fb",stage);
        if(t===r.a){ st.done=true; b.classList.add("ok"); const p=4-st.shown; pts(p); st.shown=3; draw(); fb(m,true,`Juist, het is ${r.a}! +${p} punten.`); }
        else { b.classList.add("no"); b.disabled=true;
          if(st.shown<3){ st.shown++; draw(); fb(m,false,"Niet juist. Je krijgt een extra hint."); }
          else { st.done=true; stage.querySelectorAll("#w-opts button").forEach(x=>{ if(x.textContent===r.a) x.classList.add("ok"); }); draw(); fb(m,false,`Helaas, het juiste antwoord is ${r.a}.`); } } }
      $("#w-hint",stage).addEventListener("click",()=>{ if(st.shown<3){ st.shown++; draw(); } });
      $("#w-next",stage).addEventListener("click",next); next();
    },
    chain(){
      stage.innerHTML=`<div class="ar-game"><div class="ar-head"><h2 id="c-title">Kettingreactie</h2><span class="ar-meta" id="c-meta"></span><p id="c-q"></p></div>
        <ol class="ar-chain" id="c-list"></ol><div class="actions"><button type="button" class="btn" id="c-check">Controleer</button><button type="button" class="btn ghost" id="c-next">Volgende ketting</button></div><div class="ar-fb" id="c-fb" aria-live="polite"></div></div>`;
      let st={k:-1,cur:[],checked:false};
      function draw(marks){ const ol=$("#c-list",stage); ol.innerHTML="";
        st.cur.forEach((s,i)=>{ const li=document.createElement("li"); if(marks) li.className=marks[i]?"ok":"no";
          li.innerHTML=`<span class="n" aria-hidden="true"></span><span class="t"></span>`; $(".t",li).textContent=s;
          const up=h(`<button type="button" class="ar-mv">↑</button>`), dn=h(`<button type="button" class="ar-mv">↓</button>`);
          up.setAttribute("aria-label","Omhoog: "+s); dn.setAttribute("aria-label","Omlaag: "+s); up.disabled=i===0||st.checked; dn.disabled=i===st.cur.length-1||st.checked;
          up.addEventListener("click",()=>{ [st.cur[i-1],st.cur[i]]=[st.cur[i],st.cur[i-1]]; draw(); ol.children[i-1].querySelector(".ar-mv").focus(); });
          dn.addEventListener("click",()=>{ [st.cur[i+1],st.cur[i]]=[st.cur[i],st.cur[i+1]]; draw(); ol.children[i+1].querySelectorAll(".ar-mv")[1].focus(); });
          li.append(up,dn); ol.appendChild(li); }); }
      function next(){ st.k=(st.k+1)%AR_CHAINS.length; const c=AR_CHAINS[st.k]; let cur; do{ cur=shuffle(c.s); }while(cur.every((x,i)=>x===c.s[i]));
        st.cur=cur; st.checked=false; $("#c-title",stage).textContent=c.t; $("#c-q",stage).textContent=c.q+" Zet de stappen in de juiste volgorde met de pijltjes en controleer. Elke stap op de juiste plaats = 1 punt.";
        $("#c-fb",stage).textContent=""; $("#c-check",stage).disabled=false; $("#c-meta",stage).textContent=`Ketting ${st.k+1}/${AR_CHAINS.length}`; draw(); }
      $("#c-check",stage).addEventListener("click",()=>{ if(st.checked) return; const c=AR_CHAINS[st.k]; const marks=st.cur.map((s,i)=>s===c.s[i]); const n=marks.filter(Boolean).length;
        st.checked=true; draw(marks); pts(n); $("#c-check",stage).disabled=true;
        fb($("#c-fb",stage),n===c.s.length, n===c.s.length?`Perfect! +${n} punten.`:`${n} van de ${c.s.length} stappen staan juist: +${n} punten. Juiste volgorde: ${c.s.join(" → ")}`); });
      $("#c-next",stage).addEventListener("click",next); next();
    }
  };
  const tabs=v.querySelectorAll(".ar-tabs button");
  function open(g){ arTab=g; clearInterval(timer); tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.g===g)); GAMES[g](); }
  v.querySelector(".ar-tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) open(b.dataset.g); });
  open(arTab);
}

/* ---------- ROUTER ---------- */
let current="start";
function route(){
  const id=(location.hash||"#start").slice(1);
  const ch=CH.find(c=>c.id===id);
  current = ch?id:(["begrippen","toets","arena"].includes(id)?id:"start");
  const app=$("#app"); app.innerHTML="";
  if(ch) renderChapter(app,ch); else if(current==="begrippen") renderGloss(app); else if(current==="toets") renderQuiz(app); else if(current==="arena") renderArena(app); else renderStart(app);
  renderTabs(current); window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
